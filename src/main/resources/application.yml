spring:
  application:
    name: spring-ai-demo
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/activiti?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: activiti
    password: ${MYSQL_PASSWORD:activiti}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      enabled: false
      api-key: ${OPENAI_API_KEY:your-openai-api-key-here}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7
    ollama:
      enabled: true
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      timeout-ms: ${OLLAMA_TIMEOUT_MS:60000}
      generate:
        num-predict: ${OLLAMA_NUM_PREDICT:512}
      chat:
        enabled: true
        options:
          model: qwen2.5
          temperature: 0.7
    dashscope:
      enabled: true
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key-here}
      image:
        enabled: true
        options:
          model: wanx2.1-t2i-turbo
          size: 1024x1024
    stabilityai:
      enabled: true
      api-key: ${STABILITYAI_API_KEY:your-stabilityai-api-key-here}
      image:
        enabled: true
        options:
          model: stability-diffusion-xl-1024-v1-0
          size: 1024x1024
  sms:
    enabled: false
    api-key: ${SMS_API_KEY:}
    api-url: ${SMS_API_URL:}
    template-id: ${SMS_TEMPLATE_ID:}
  mvc:
    welcome-page:
      enabled: false

server:
  port: 8080

deploy:
  project-dir: ${DEPLOY_PROJECT_DIR:.}

modeling:
  output-dir: ${MODELING_OUTPUT_DIR:output/modeling-jobs}
  triposplat:
    base-url: ${TRIPOSPLAT_BASE_URL:}

zhipu:
  video:
    model: ${ZHIPU_VIDEO_MODEL:cogvideox-flash}

rag:
  vector:
    provider: ${RAG_VECTOR_PROVIDER:local}
    qdrant:
      url: ${QDRANT_URL:http://localhost:6333}
      collection: ${QDRANT_COLLECTION:spring_ai_rag_chunks}
      timeout-ms: ${QDRANT_TIMEOUT_MS:1200}
