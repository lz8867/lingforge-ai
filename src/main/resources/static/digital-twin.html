<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 能力治理中心 - Spring AI Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css">
    <link rel="stylesheet" href="/css/tech-theme.css?v=20260610-depth">
    <link rel="stylesheet" href="/css/app-layout.css?v=20260616-mineru1">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#22d3ee',
                        success: '#34d399',
                        warning: '#f59e0b',
                        danger: '#fb7185'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body[data-app-page="digital-twin"] .app-content-shell {
            padding: 0 !important;
            border: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
        }

        .twin-workbench {
            width: min(100%, 1720px);
            height: calc(100vh - var(--app-header-height) - 24px);
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 12px;
            overflow: hidden;
        }

        .twin-status-strip {
            display: grid;
            grid-template-columns: minmax(240px, 0.95fr) repeat(4, minmax(138px, 0.46fr)) auto;
            gap: 10px;
            align-items: stretch;
        }

        .twin-status-item,
        .twin-panel {
            border: 1px solid rgba(125, 211, 252, 0.2);
            border-radius: 8px;
            background:
                linear-gradient(135deg, rgba(34, 211, 238, 0.08), transparent 48%),
                rgba(3, 10, 20, 0.82);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .twin-status-item {
            min-height: 74px;
            padding: 13px 14px;
            display: grid;
            align-content: center;
            gap: 5px;
            min-width: 0;
        }

        .twin-status-item span,
        .twin-panel-kicker,
        .twin-metric span {
            color: #9fb5c9;
            font-size: 12px;
            font-weight: 800;
            line-height: 1.2;
        }

        .twin-status-item strong {
            color: #f8fafc;
            font-size: clamp(18px, 1.9vw, 28px);
            line-height: 1;
        }

        .twin-status-item p {
            overflow: hidden;
            margin: 0;
            color: #bfd3e4;
            font-size: 12px;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .twin-refresh-button,
        .twin-node-button,
        .twin-icon-button {
            border: 1px solid rgba(125, 211, 252, 0.22);
            border-radius: 8px;
            color: #dff8ff;
            background: rgba(8, 19, 36, 0.76);
            transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
        }

        .twin-refresh-button {
            min-height: 74px;
            min-width: 86px;
            display: grid;
            place-items: center;
            font-size: 20px;
        }

        .twin-refresh-button:hover,
        .twin-node-button:hover,
        .twin-icon-button:hover,
        .twin-node-button.is-active {
            border-color: rgba(34, 211, 238, 0.62);
            background: rgba(34, 211, 238, 0.14);
            transform: translateY(-1px);
        }

        .twin-main-grid {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(300px, 0.82fr) minmax(0, 1.28fr) minmax(340px, 0.9fr);
            gap: 12px;
            overflow: hidden;
        }

        .twin-panel {
            min-height: 0;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
        }

        .twin-panel-head {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(125, 211, 252, 0.16);
        }

        .twin-panel-head h2,
        .twin-panel-head h3 {
            margin: 3px 0 0;
            color: #f8fafc;
            font-size: 16px;
            font-weight: 900;
            line-height: 1.15;
        }

        .twin-panel-body {
            min-height: 0;
            overflow: auto;
            padding: 12px;
        }

        .twin-node-list {
            display: grid;
            gap: 8px;
        }

        .twin-impact-board {
            display: grid;
            gap: 8px;
            margin-bottom: 10px;
        }

        .twin-impact-card {
            min-height: 72px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 11px;
            border: 1px solid rgba(125, 211, 252, 0.16);
            border-radius: 8px;
            background: rgba(8, 19, 36, 0.58);
        }

        .twin-impact-card strong {
            display: block;
            color: #f8fafc;
            font-size: 14px;
            line-height: 1.2;
        }

        .twin-impact-card span {
            display: block;
            margin-top: 5px;
            color: #9fb5c9;
            font-size: 12px;
            line-height: 1.35;
        }

        .twin-impact-score {
            min-width: 58px;
            color: #67e8f9;
            font-size: 24px;
            font-weight: 950;
            line-height: 1;
            text-align: right;
        }

        .twin-node-button {
            width: 100%;
            min-height: 78px;
            display: grid;
            grid-template-columns: 38px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            padding: 10px;
            text-align: left;
        }

        .twin-node-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            color: #67e8f9;
            background: rgba(34, 211, 238, 0.13);
        }

        .twin-node-text {
            min-width: 0;
            display: grid;
            gap: 6px;
        }

        .twin-node-text strong,
        .twin-detail-title strong {
            overflow: hidden;
            color: #f8fafc;
            font-size: 14px;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .twin-node-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            min-width: 0;
        }

        .twin-business-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .twin-business-tags span,
        .twin-mini-tag {
            min-height: 22px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 7px;
            border: 1px solid rgba(125, 211, 252, 0.16);
            border-radius: 999px;
            color: #c8f4ff;
            background: rgba(34, 211, 238, 0.08);
            font-size: 11px;
            font-weight: 850;
            line-height: 1;
        }

        .twin-node-text span,
        .twin-detail-title span {
            overflow: hidden;
            color: #9fb5c9;
            font-size: 12px;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .twin-status-pill {
            min-width: 78px;
            padding: 5px 8px;
            border: 1px solid rgba(125, 211, 252, 0.24);
            border-radius: 999px;
            color: #dff8ff;
            background: rgba(15, 23, 42, 0.72);
            font-size: 11px;
            font-weight: 900;
            line-height: 1;
            text-align: center;
        }

        .twin-status-pill.is-info {
            color: #bae6fd;
            border-color: rgba(56, 189, 248, 0.42);
        }

        .twin-status-pill.is-online {
            color: #bbf7d0;
            border-color: rgba(52, 211, 153, 0.45);
        }

        .twin-status-pill.is-warning,
        .twin-status-pill.is-standby {
            color: #fde68a;
            border-color: rgba(245, 158, 11, 0.42);
        }

        .twin-status-pill.is-offline,
        .twin-status-pill.is-critical {
            color: #fecdd3;
            border-color: rgba(251, 113, 133, 0.48);
        }

        .twin-topology-stage {
            position: relative;
            min-height: 0;
            height: 100%;
            overflow: hidden;
            border-radius: 8px;
            background:
                linear-gradient(rgba(125, 211, 252, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(125, 211, 252, 0.04) 1px, transparent 1px),
                rgba(2, 8, 18, 0.72);
            background-size: 34px 34px;
        }

        .twin-chain-summary {
            position: absolute;
            left: 14px;
            top: 14px;
            z-index: 2;
            max-width: min(520px, calc(100% - 28px));
            display: grid;
            gap: 8px;
            pointer-events: none;
        }

        .twin-chain-summary strong {
            color: #f8fafc;
            font-size: 13px;
            line-height: 1.2;
        }

        .twin-chain-summary span {
            color: #9fb5c9;
            font-size: 12px;
            line-height: 1.35;
        }

        #twin-topology-canvas {
            width: 100%;
            height: 100%;
            min-height: 460px;
            display: block;
        }

        .twin-topology-legend {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 14px;
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            pointer-events: none;
        }

        .twin-topology-legend span {
            min-height: 28px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 9px;
            border: 1px solid rgba(125, 211, 252, 0.2);
            border-radius: 999px;
            color: #dbeafe;
            background: rgba(3, 10, 20, 0.76);
            font-size: 11px;
            font-weight: 800;
        }

        .twin-detail {
            display: grid;
            gap: 12px;
        }

        .twin-detail-title {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }

        .twin-detail-summary {
            margin: 0;
            color: #c9d9e8;
            font-size: 13px;
            line-height: 1.5;
        }

        .twin-meter {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
        }

        .twin-meter span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #22d3ee, #34d399);
        }

        .twin-metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .twin-metric {
            min-height: 70px;
            padding: 10px;
            border: 1px solid rgba(125, 211, 252, 0.15);
            border-radius: 8px;
            background: rgba(8, 19, 36, 0.58);
            min-width: 0;
        }

        .twin-metric strong {
            display: block;
            overflow: hidden;
            margin-top: 8px;
            color: #f8fafc;
            font-size: 14px;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .twin-action-list,
        .twin-action-queue,
        .twin-event-list,
        .twin-recommendation-list {
            display: grid;
            gap: 8px;
        }

        .twin-action-list span,
        .twin-action-queue-item,
        .twin-event,
        .twin-recommendation-list li {
            border: 1px solid rgba(125, 211, 252, 0.14);
            border-radius: 8px;
            background: rgba(8, 19, 36, 0.52);
        }

        .twin-action-queue {
            margin-bottom: 12px;
        }

        .twin-action-queue-item {
            display: grid;
            gap: 8px;
            padding: 11px;
        }

        .twin-action-queue-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .twin-action-queue-title strong {
            overflow: hidden;
            color: #f8fafc;
            font-size: 13px;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .twin-action-queue-item p {
            margin: 0;
            color: #9fb5c9;
            font-size: 12px;
            line-height: 1.45;
        }

        .twin-action-list span,
        .twin-action-list button {
            min-height: 34px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            color: #dff8ff;
            font-size: 12px;
            font-weight: 800;
        }

        .twin-action-list button {
            width: 100%;
            text-align: left;
        }

        .twin-action-list a {
            min-height: 34px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            color: #dff8ff;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            border: 1px solid rgba(125, 211, 252, 0.14);
            border-radius: 8px;
            background: rgba(8, 19, 36, 0.52);
        }

        .twin-action-list a:hover {
            border-color: rgba(34, 211, 238, 0.45);
            background: rgba(34, 211, 238, 0.12);
        }

        .twin-section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin: 2px 0 8px;
            color: #9fb5c9;
            font-size: 12px;
            font-weight: 900;
            line-height: 1.2;
        }

        .twin-divider {
            height: 1px;
            margin: 12px 0;
            background: rgba(125, 211, 252, 0.14);
        }

        .twin-event {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 9px;
            padding: 10px;
        }

        .twin-event i {
            margin-top: 2px;
            color: #67e8f9;
        }

        .twin-event strong {
            display: block;
            overflow: hidden;
            color: #f8fafc;
            font-size: 13px;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .twin-event p {
            margin: 4px 0 0;
            color: #9fb5c9;
            font-size: 12px;
            line-height: 1.4;
        }

        .twin-recommendation-list {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .twin-recommendation-list li {
            min-height: 44px;
            padding: 10px 11px;
            color: #c9d9e8;
            font-size: 12px;
            line-height: 1.45;
        }

        .twin-empty,
        .twin-error {
            min-height: 120px;
            display: grid;
            place-items: center;
            padding: 18px;
            color: #9fb5c9;
            text-align: center;
        }

        .twin-error {
            color: #fecdd3;
        }

        .twin-spin {
            animation: twinSpin 900ms linear infinite;
        }

        @keyframes twinSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1180px) {
            .twin-workbench {
                height: auto;
                overflow: visible;
            }

            .twin-status-strip,
            .twin-main-grid,
            .twin-metrics-grid,
            .twin-impact-card {
                grid-template-columns: 1fr;
            }

            .twin-panel {
                max-height: none;
            }

            .twin-topology-stage {
                height: 520px;
            }

            #twin-topology-canvas {
                min-height: 520px;
            }
        }
    </style>
</head>
<body class="bg-slate-950 font-inter text-slate-100">
<main>
    <section class="twin-workbench" aria-label="AI 能力治理中心工作台">
        <div class="twin-status-strip" id="twin-status-strip">
            <article class="twin-status-item">
                <span>当前业务影响</span>
                <strong id="twin-health-score">--</strong>
                <p id="twin-health-message">正在读取能力治理状态</p>
            </article>
            <article class="twin-status-item">
                <span>待处置能力</span>
                <strong id="twin-capability-count">--</strong>
                <p>异常、关注与待确认</p>
            </article>
            <article class="twin-status-item">
                <span>可用业务入口</span>
                <strong id="twin-online-count">--</strong>
                <p>可直接承载用户请求</p>
            </article>
            <article class="twin-status-item">
                <span>活跃告警</span>
                <strong id="twin-alert-count">--</strong>
                <p>影响链路需确认</p>
            </article>
            <article class="twin-status-item">
                <span>刷新时间</span>
                <strong id="twin-updated-at">--</strong>
                <p>自动刷新中</p>
            </article>
            <button type="button" class="twin-refresh-button" onclick="loadDigitalTwinOverview()" aria-label="刷新能力治理概览" title="刷新能力治理概览">
                <i class="fa fa-refresh" id="twin-refresh-icon"></i>
            </button>
        </div>

        <div class="twin-main-grid">
            <aside class="twin-panel" aria-label="能力入口与业务影响">
                <div class="twin-panel-head">
                    <div>
                        <span class="twin-panel-kicker">业务入口</span>
                        <h2>能力与影响</h2>
                    </div>
                    <span class="twin-status-pill" id="twin-global-status">LOADING</span>
                </div>
                <div class="twin-panel-body">
                    <div id="twin-impact-board" class="twin-impact-board" aria-label="业务影响面">
                        <div class="twin-empty"><i class="fa fa-refresh twin-spin"></i> 正在分析业务影响面</div>
                    </div>
                    <div class="twin-section-label">
                        <span>影响业务</span>
                        <span id="twin-capability-summary">--</span>
                    </div>
                    <div id="twin-node-list" class="twin-node-list">
                        <div class="twin-empty"><i class="fa fa-refresh twin-spin"></i> 正在加载能力入口</div>
                    </div>
                </div>
            </aside>

            <section class="twin-panel" aria-label="AI 能力调用链路">
                <div class="twin-panel-head">
                    <div>
                        <span class="twin-panel-kicker">调用链路</span>
                        <h2>业务链路</h2>
                    </div>
                    <button type="button" class="twin-icon-button w-9 h-9" onclick="renderTwinTopology()" title="重绘调用链路" aria-label="重绘调用链路">
                        <i class="fa fa-crosshairs"></i>
                    </button>
                </div>
                <div class="twin-topology-stage">
                    <div class="twin-chain-summary">
                        <strong id="twin-chain-title">从运行底座到业务入口</strong>
                        <span id="twin-chain-copy">按真实依赖关系展示 AI 能力的上游、编排、知识和业务入口影响。</span>
                    </div>
                    <canvas id="twin-topology-canvas" aria-label="AI 能力调用链路"></canvas>
                    <div class="twin-topology-legend" aria-hidden="true">
                        <span><i class="fa fa-circle text-emerald-300"></i>在线</span>
                        <span><i class="fa fa-circle text-amber-300"></i>待确认</span>
                        <span><i class="fa fa-circle text-rose-300"></i>不可用</span>
                    </div>
                </div>
            </section>

            <aside class="twin-panel" aria-label="待处置队列与能力诊断">
                <div class="twin-panel-head">
                    <div>
                        <span class="twin-panel-kicker">处置队列</span>
                        <h2>待处置与诊断</h2>
                    </div>
                    <span class="twin-status-pill" id="twin-detail-status">--</span>
                </div>
                <div class="twin-panel-body">
                    <div class="twin-section-label">
                        <span>下一步动作</span>
                        <span id="twin-action-count">--</span>
                    </div>
                    <div id="twin-action-queue" class="twin-action-queue">
                        <div class="twin-empty">正在生成待处置队列</div>
                    </div>
                    <div class="twin-detail" id="twin-detail">
                        <div class="twin-empty">选择一个能力对象查看详情</div>
                    </div>
                    <div class="twin-divider"></div>
                    <div>
                        <div class="twin-panel-head px-0 pt-0 border-0">
                            <div>
                                <span class="twin-panel-kicker">处置建议</span>
                                <h3>建议</h3>
                            </div>
                        </div>
                        <ol id="twin-recommendation-list" class="twin-recommendation-list"></ol>
                    </div>
                    <div class="mt-4">
                        <div class="twin-panel-head px-0 pt-0 border-0">
                            <div>
                                <span class="twin-panel-kicker">诊断事件</span>
                                <h3>事件</h3>
                            </div>
                        </div>
                        <div id="twin-event-list" class="twin-event-list"></div>
                    </div>
                </div>
            </aside>
        </div>
    </section>
</main>

<script>
    const twinState = {
        overview: null,
        selectedNodeId: null,
        nodePositions: new Map(),
        loading: false
    };

    const twinActionRoutes = {
        '进入对话': '/chat.html',
        '检查模型服务': '/service-dashboard.html',
        '评测 Prompt': '/prompt-optimizer.html',
        '沉淀优化版本': '/prompt-optimizer.html',
        '维护知识': '/rag-demo.html',
        '补齐分类标签': '/rag-demo.html',
        '测试检索命中': '/rag-demo.html',
        '补充高频问答资料': '/rag-demo.html',
        '发起评测': '/document-quality.html',
        '查看趋势': '/document-quality.html',
        '检查模型桥': '/text-to-image.html',
        '生成样例资产': '/text-to-image.html',
        '生成巡检报告': '/service-dashboard.html',
        '沉淀复盘结论': '/document-quality.html',
        '查看运行大屏': '/service-dashboard.html',
        '查看 Docker 日志': '/index.html#logs',
        '刷新状态': 'javascript:loadDigitalTwinOverview()',
        '补充 usage 上报': '/skill-monitor.html'
    };

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function statusLabel(status) {
        const labels = {
            ONLINE: '在线',
            WARNING: '关注',
            STANDBY: '待确认',
            OFFLINE: '不可用',
            CRITICAL: '严重',
            INFO: '提示'
        };
        return labels[status] || status || '--';
    }

    function statusClass(status) {
        return 'is-' + String(status || 'warning').toLowerCase();
    }

    function shortTime(value) {
        if (!value) {
            return '--';
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return String(value).slice(11, 19) || String(value);
        }
        return date.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function formatMetricValue(value) {
        if (Array.isArray(value)) {
            return value.join(' / ');
        }
        if (typeof value === 'boolean') {
            return value ? '是' : '否';
        }
        if (typeof value === 'number') {
            return Number.isInteger(value) ? String(value) : value.toFixed(1);
        }
        return value == null || value === '' ? '--' : String(value);
    }

    function displayNodeName(node) {
        return String(node?.name || '').replaceAll('孪生', '').trim() || '--';
    }

    function statusPriority(status) {
        const priorities = { OFFLINE: 0, CRITICAL: 0, WARNING: 1, STANDBY: 2, ONLINE: 3, INFO: 4 };
        return priorities[status] ?? 2;
    }

    function issueLevel(node) {
        if (!node) {
            return 'INFO';
        }
        if (node.status === 'OFFLINE' || node.status === 'CRITICAL') {
            return 'CRITICAL';
        }
        if (node.status === 'WARNING' || node.healthScore < 75) {
            return 'WARNING';
        }
        if (node.status === 'STANDBY') {
            return 'STANDBY';
        }
        return 'ONLINE';
    }

    function businessTagsForNode(node) {
        const tags = {
            'service-runtime': ['全部 AI 入口', '运行大屏', '部署验证'],
            'chat-assistant': ['AI 对话', '模型响应'],
            'prompt-engine': ['Prompt 优化', '模型评测'],
            'knowledge-base': ['知识库', 'RAG 上下文'],
            'rag-engine': ['RAG 问答', '证据检索'],
            'document-quality': ['文档质量', '整改建议'],
            'media-generation': ['文生图', '图生文', '文生视频'],
            'governance-tools': ['治理分析', '复盘沉淀'],
            'deployment-pipeline': ['部署', '日志', '容器状态'],
            'skill-monitor': ['Skill 清单', '本地能力治理']
        };
        return tags[node?.id] || [node?.type || '能力入口'];
    }

    function metricLabel(key) {
        const labels = {
            entry: '入口',
            provider: '模型供应商',
            evaluationMode: '评测方式',
            totalKnowledge: '知识总数',
            publishedKnowledge: '已发布知识',
            draftKnowledge: '草稿知识',
            topK: '召回 TopK',
            knowledgeReady: '知识上下文',
            recentRecords: '最近评测',
            averageScore: '平均分',
            imageEntry: '文生图入口',
            visionEntry: '图生文入口',
            videoEntry: '文生视频入口',
            modes: '治理模式',
            deploymentState: '部署状态',
            dockerAvailable: 'Docker 可用',
            containerCount: '容器数',
            serviceState: '服务状态',
            memoryUsagePercent: '内存使用率',
            systemCpuLoadPercent: 'CPU 负载',
            diskUsagePercent: '磁盘使用率',
            threadCount: '线程数',
            healthLatencyMs: '健康检查延迟',
            status: '连接状态',
            skills: 'Skill 总数',
            usedSkills: '已使用 Skill',
            events: '使用事件',
            successRate: '成功率',
            attentionSkills: '关注 Skill',
            lastChecked: '最近检查'
        };
        return labels[key] || key;
    }

    function businessTagHtml(node) {
        return '<span class="twin-business-tags">' + businessTagsForNode(node)
            .map(tag => '<span><i class="fa fa-link"></i>' + escapeHtml(tag) + '</span>')
            .join('') + '</span>';
    }

    function actionParts(action) {
        const [labelRaw, hrefRaw] = String(action || '').split('::');
        const label = (labelRaw || '').trim();
        const href = (hrefRaw || '').trim() || twinActionRoutes[label] || '';
        return { label, href };
    }

    function nodesSortedForWork() {
        const nodes = twinState.overview?.nodes || [];
        return [...nodes].sort((left, right) => {
            const byStatus = statusPriority(left.status) - statusPriority(right.status);
            if (byStatus !== 0) {
                return byStatus;
            }
            return left.healthScore - right.healthScore;
        });
    }

    function currentNode() {
        const overview = twinState.overview;
        if (!overview || !overview.nodes || overview.nodes.length === 0) {
            return null;
        }
        return overview.nodes.find(node => node.id === twinState.selectedNodeId) || overview.nodes[0];
    }

    function loadDigitalTwinOverview() {
        if (twinState.loading) {
            return;
        }
        twinState.loading = true;
        document.getElementById('twin-refresh-icon')?.classList.add('twin-spin');

        fetch('/api/digital-twin/overview')
            .then(response => {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                return response.json();
            })
            .then(overview => {
                twinState.overview = overview;
                if (!twinState.selectedNodeId || !overview.nodes.some(node => node.id === twinState.selectedNodeId)) {
                    twinState.selectedNodeId = overview.nodes[0]?.id || null;
                }
                renderTwinWorkbench();
            })
            .catch(error => {
                renderTwinError(error.message);
            })
            .finally(() => {
                twinState.loading = false;
                document.getElementById('twin-refresh-icon')?.classList.remove('twin-spin');
            });
    }

    function renderTwinWorkbench() {
        renderTwinStatus();
        renderTwinImpactBoard();
        renderTwinNodeList();
        renderTwinActionQueue();
        renderTwinDetail();
        renderTwinEvents();
        renderTwinRecommendations();
        renderTwinTopology();
    }

    function renderTwinError(message) {
        document.getElementById('twin-health-message').textContent = '读取失败';
        document.getElementById('twin-global-status').textContent = 'ERROR';
        document.getElementById('twin-node-list').innerHTML = '<div class="twin-error"><i class="fa fa-exclamation-triangle"></i> 能力治理概览读取失败：' + escapeHtml(message) + '</div>';
        document.getElementById('twin-impact-board').innerHTML = '<div class="twin-error">暂时无法判断业务影响面。</div>';
        document.getElementById('twin-action-queue').innerHTML = '<div class="twin-error">暂时无法生成待处置队列。</div>';
        document.getElementById('twin-detail').innerHTML = '<div class="twin-error">请确认后端服务和 /api/digital-twin/overview 接口可用。</div>';
    }

    function renderTwinStatus() {
        const overview = twinState.overview;
        if (!overview) {
            return;
        }
        const attentionCount = Number(overview.warningCapabilities || 0) + Number(overview.criticalCapabilities || 0);
        const impactLevel = overview.criticalCapabilities > 0 ? '高' : overview.activeAlerts > 0 || attentionCount > 0 ? '中' : '低';
        document.getElementById('twin-health-score').textContent = impactLevel;
        document.getElementById('twin-health-message').textContent = '健康度 ' + overview.healthScore + '%，' + (impactLevel === '低' ? '当前可稳定承载业务。' : '需优先处理影响链路。');
        document.getElementById('twin-capability-count').textContent = attentionCount;
        document.getElementById('twin-online-count').textContent = overview.onlineCapabilities + '/' + overview.totalCapabilities;
        document.getElementById('twin-alert-count').textContent = overview.activeAlerts;
        document.getElementById('twin-updated-at').textContent = shortTime(overview.checkedAt);
        document.getElementById('twin-capability-summary').textContent = overview.totalCapabilities + ' 个能力';
        const globalStatus = document.getElementById('twin-global-status');
        const status = overview.criticalCapabilities > 0 ? 'OFFLINE' : overview.activeAlerts > 0 ? 'WARNING' : 'ONLINE';
        globalStatus.textContent = statusLabel(status);
        globalStatus.className = 'twin-status-pill ' + statusClass(status);
    }

    function renderTwinImpactBoard() {
        const board = document.getElementById('twin-impact-board');
        const overview = twinState.overview;
        if (!board || !overview) {
            return;
        }
        const nodes = overview.nodes || [];
        const groups = [
            {
                title: 'AI 交互链路',
                ids: ['chat-assistant', 'prompt-engine', 'rag-engine'],
                copy: '覆盖对话、Prompt 优化和依据型回答。'
            },
            {
                title: '知识与质量治理',
                ids: ['knowledge-base', 'document-quality', 'governance-tools'],
                copy: '影响知识引用、文档评分和整改建议。'
            },
            {
                title: '运行与交付底座',
                ids: ['service-runtime', 'deployment-pipeline', 'skill-monitor'],
                copy: '影响服务可达、部署日志和本地 Skill 治理。'
            }
        ];
        board.innerHTML = groups.map(group => {
            const related = group.ids
                .map(id => nodes.find(node => node.id === id))
                .filter(Boolean);
            const score = related.length
                ? Math.round(related.reduce((sum, node) => sum + Number(node.healthScore || 0), 0) / related.length)
                : 0;
            const worst = related.some(node => issueLevel(node) === 'CRITICAL')
                ? 'CRITICAL'
                : related.some(node => issueLevel(node) === 'WARNING')
                ? 'WARNING'
                : related.some(node => issueLevel(node) === 'STANDBY')
                ? 'STANDBY'
                : 'ONLINE';
            return [
                '<article class="twin-impact-card">',
                '<div><strong>' + escapeHtml(group.title) + '</strong><span>' + escapeHtml(group.copy) + '</span></div>',
                '<div class="twin-impact-score">' + score + '</div>',
                '<span class="twin-status-pill ' + statusClass(worst) + '">' + statusLabel(worst) + '</span>',
                '</article>'
            ].join('');
        }).join('');
    }

            '</div>',

        const items = [
            ...attentionNodes.map(node => ({ type: 'node', severity: issueLevel(node), node })),

        ].slice(0, 5);

    function renderTwinTopology() {
        const canvas = document.getElementById('twin-topology-canvas');
        const overview = twinState.overview;
        if (!canvas || !overview) {
            return;
        }
        const rect = canvas.getBoundingClientRect();
        const width = Math.max(320, rect.width);
        const height = Math.max(360, rect.height);
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        const context = canvas.getContext('2d');
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, width, height);

        const nodes = overview.nodes || [];
        const relations = overview.relations || [];
        const layers = topologyLayers(nodes);
        twinState.nodePositions.clear();
        layers.forEach((layer, layerIndex) => {
            const x = 80 + layerIndex * ((width - 160) / Math.max(1, layers.length - 1));
            const availableTop = 118;
            const availableHeight = Math.max(220, height - 210);
            layer.nodes.forEach((node, nodeIndex) => {
                const y = availableTop + (nodeIndex + 1) * (availableHeight / (layer.nodes.length + 1));
                twinState.nodePositions.set(node.id, {
                    x,
                    y,
                    r: node.id === twinState.selectedNodeId ? 34 : 29,
                    layer: layer.name
                });
            });
        });

        drawTopologyBackground(context, width, height, layers);
        relations.forEach(relation => drawRelation(context, relation));
        nodes.forEach(node => drawNode(context, node));
        updateChainSummary(nodes, relations);
    }

    function topologyLayers(nodes) {
        const layerDefinitions = [
            { name: '运行底座', ids: ['service-runtime', 'deployment-pipeline'] },
            { name: 'AI 编排', ids: ['prompt-engine', 'chat-assistant'] },
            { name: '知识增强', ids: ['knowledge-base', 'rag-engine'] },
            { name: '业务治理', ids: ['document-quality', 'governance-tools', 'skill-monitor'] },
            { name: '内容入口', ids: ['media-generation'] }
        ];
        return layerDefinitions
            .map(layer => ({
                name: layer.name,
                nodes: layer.ids.map(id => nodes.find(node => node.id === id)).filter(Boolean)
            }))
            .filter(layer => layer.nodes.length > 0);
    }

    function drawTopologyBackground(context, width, height, layers) {
        const gradient = context.createRadialGradient(width * 0.5, height * 0.46, 10, width * 0.5, height * 0.46, Math.max(width, height) * 0.42);
        gradient.addColorStop(0, 'rgba(34, 211, 238, 0.18)');
        gradient.addColorStop(1, 'rgba(34, 211, 238, 0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);

        context.save();
        context.font = '800 12px system-ui, sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'top';
        layers.forEach((layer, layerIndex) => {
            const x = 80 + layerIndex * ((width - 160) / Math.max(1, layers.length - 1));
            context.fillStyle = 'rgba(125, 211, 252, 0.06)';
            context.fillRect(x - 58, 82, 116, Math.max(260, height - 150));
            context.strokeStyle = 'rgba(125, 211, 252, 0.12)';
            context.strokeRect(x - 58, 82, 116, Math.max(260, height - 150));
            context.fillStyle = '#9fb5c9';
            context.fillText(layer.name, x, 92);
        });
        context.restore();
    }

    function drawRelation(context, relation) {
        const source = twinState.nodePositions.get(relation.source);
        const target = twinState.nodePositions.get(relation.target);
        if (!source || !target) {
            return;
        }
        context.save();
        context.strokeStyle = relation.status === 'ONLINE' ? 'rgba(52, 211, 153, 0.52)' : relation.status === 'OFFLINE' ? 'rgba(251, 113, 133, 0.52)' : 'rgba(245, 158, 11, 0.5)';
        context.lineWidth = 2;
        context.setLineDash(relation.status === 'ONLINE' ? [] : [6, 6]);
        context.beginPath();
        const midX = (source.x + target.x) / 2;
        context.moveTo(source.x, source.y);
        context.bezierCurveTo(midX, source.y, midX, target.y, target.x, target.y);
        context.stroke();
        context.setLineDash([]);
        drawArrowHead(context, source, target);
        context.restore();
    }

    function drawArrowHead(context, source, target) {
        const angle = Math.atan2(target.y - source.y, target.x - source.x);
        const size = 8;
        const x = target.x - Math.cos(angle) * (target.r + 4);
        const y = target.y - Math.sin(angle) * (target.r + 4);
        context.beginPath();
        context.moveTo(x, y);
        context.lineTo(x - Math.cos(angle - Math.PI / 6) * size, y - Math.sin(angle - Math.PI / 6) * size);
        context.lineTo(x - Math.cos(angle + Math.PI / 6) * size, y - Math.sin(angle + Math.PI / 6) * size);
        context.closePath();
        context.fillStyle = context.strokeStyle;
        context.fill();
    }

    function drawNode(context, node) {
        const position = twinState.nodePositions.get(node.id);
        if (!position) {
            return;
        }
        const selected = node.id === twinState.selectedNodeId;
        const color = node.status === 'ONLINE' ? '#34d399' : node.status === 'OFFLINE' ? '#fb7185' : '#f59e0b';
        context.save();
        context.shadowBlur = selected ? 24 : 12;
        context.shadowColor = color;
        context.fillStyle = 'rgba(3, 10, 20, 0.92)';
        context.strokeStyle = color;
        context.lineWidth = selected ? 3 : 2;
        context.beginPath();
        context.arc(position.x, position.y, position.r, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        context.shadowBlur = 0;
        context.fillStyle = color;
        context.font = '700 12px system-ui, sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(String(node.healthScore), position.x, position.y);

        context.fillStyle = '#dbeafe';
        context.font = '700 12px system-ui, sans-serif';
        const rawLabel = displayNodeName(node);
        const label = rawLabel.length > 8 ? rawLabel.slice(0, 8) : rawLabel;
        context.fillText(label, position.x, position.y + position.r + 17);
        context.fillStyle = '#9fb5c9';
        context.font = '700 10px system-ui, sans-serif';
        context.fillText(businessTagsForNode(node)[0] || node.type, position.x, position.y + position.r + 32);
        context.restore();
    }

    function updateChainSummary(nodes, relations) {
        const selected = currentNode();
        const title = document.getElementById('twin-chain-title');
        const copy = document.getElementById('twin-chain-copy');
        if (!selected || !title || !copy) {
            return;
        }
        const incoming = relations.filter(relation => relation.source === selected.id || relation.target === selected.id).length;
        title.textContent = displayNodeName(selected) + ' · ' + statusLabel(selected.status);
        copy.textContent = '影响 ' + businessTagsForNode(selected).join('、') + '，关联 ' + incoming + ' 条调用依赖。';
    }

    function handleTopologyClick(event) {
        const canvas = document.getElementById('twin-topology-canvas');
        if (!canvas || !twinState.overview) {
            return;
        }
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        for (const [nodeId, position] of twinState.nodePositions.entries()) {
            const distance = Math.hypot(x - position.x, y - position.y);
            if (distance <= position.r + 8) {
                selectTwinNode(nodeId);
                return;
            }
        }
    }

    function nodeIcon(type) {
        const icons = {
            '运行态': 'fa-heartbeat',
            'AI 交互': 'fa-comments',
            '提示词': 'fa-sliders',
            '知识资产': 'fa-book',
            '知识增强': 'fa-search',
            '质量评测': 'fa-check-square-o',
            '多模态': 'fa-magic',
            '研发治理': 'fa-sitemap',
            '交付运行': 'fa-rocket',
            '本地技能': 'fa-puzzle-piece'
        };
        return icons[type] || 'fa-circle-o';
    }

    function eventIcon(severity) {
        if (severity === 'CRITICAL') {
            return 'fa-times-circle text-rose-300';
        }
        if (severity === 'WARNING') {
            return 'fa-exclamation-triangle text-amber-300';
        }
        return 'fa-info-circle text-cyan-300';
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('twin-topology-canvas')?.addEventListener('click', handleTopologyClick);
        window.addEventListener('resize', renderTwinTopology);
        loadDigitalTwinOverview();
        setInterval(loadDigitalTwinOverview, 8000);
    });
</script>
