<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务运行大屏 - Spring AI Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css">
    <link rel="stylesheet" href="/css/tech-theme.css?v=20260610-depth">
    <link rel="stylesheet" href="/css/app-layout.css?v=20260616-mineru1">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#22d3ee',
                        secondary: '#34d399',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        dark: '#1e293b',
                        light: '#f8fafc'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .runtime-screen {
            width: min(100%, 1500px);
            display: grid;
            gap: 14px;
        }

        .runtime-top {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 18px;
            align-items: center;
        }

        .runtime-panel {
            border: 1px solid rgba(125, 211, 252, 0.24);
            border-radius: 8px;
            background: rgba(8, 18, 32, 0.78);
            box-shadow: 0 18px 48px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .runtime-main-grid {
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 14px;
        }

        .runtime-metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .runtime-service-metrics {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
        }

        .runtime-metric {
            min-height: 132px;
            padding: 16px;
            border: 1px solid rgba(125, 211, 252, 0.18);
            border-radius: 8px;
            background: rgba(2, 8, 18, 0.72);
        }

        .runtime-service-metric {
            min-height: 112px;
            padding: 14px;
            border: 1px solid rgba(125, 211, 252, 0.18);
            border-radius: 8px;
            background:
                linear-gradient(135deg, rgba(34, 211, 238, 0.08), transparent 48%),
                rgba(2, 8, 18, 0.76);
        }

        .runtime-service-metric strong {
            display: block;
            margin-top: 10px;
            color: #f8fafc;
            font-size: 24px;
            line-height: 1;
        }

        .runtime-service-metric span {
            color: #9fb5c9;
            font-size: 12px;
            font-weight: 800;
        }

        .runtime-service-metric p {
            margin-top: 10px;
            color: #9fb5c9;
            font-size: 12px;
            line-height: 1.35;
        }

        .runtime-meter {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.92);
        }

        .runtime-meter > span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #22d3ee, #34d399);
            transition: width 260ms ease;
        }

        .runtime-clock {
            min-width: 176px;
            text-align: right;
        }

        .runtime-visual-stage {
            position: relative;
            min-height: 390px;
            height: clamp(360px, 38vh, 520px);
            overflow: hidden;
            border: 1px solid rgba(34, 211, 238, 0.32);
            border-radius: 8px;
            background:
                radial-gradient(circle at 50% 48%, rgba(34, 211, 238, 0.16), transparent 28%),
                radial-gradient(circle at 18% 18%, rgba(52, 211, 153, 0.12), transparent 26%),
                rgba(2, 8, 18, 0.82);
            box-shadow:
                0 22px 70px rgba(0, 0, 0, 0.46),
                inset 0 1px 0 rgba(255, 255, 255, 0.06),
                inset 0 0 42px rgba(34, 211, 238, 0.08);
        }

        .runtime-twin-facility {
            isolation: isolate;
        }

        .runtime-visual-stage::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(rgba(125, 211, 252, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(125, 211, 252, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.86), rgba(0, 0, 0, 0.28));
        }

        #runtime-visual-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .runtime-node-label-layer {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            contain: layout style paint;
        }

        .runtime-node-label {
            position: absolute;
            left: calc(var(--label-x) * 1%);
            top: calc(var(--label-y) * 1%);
            min-width: 104px;
            max-width: 174px;
            transform: translate3d(-50%, -50%, 0);
            padding: 7px 10px;
            border: 1px solid color-mix(in srgb, var(--label-color) 58%, transparent);
            border-radius: 8px;
            color: #f8fafc;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--label-color) 18%, transparent), transparent 44%),
                rgba(2, 8, 18, 0.86);
            box-shadow:
                0 10px 26px rgba(0, 0, 0, 0.32),
                0 0 24px color-mix(in srgb, var(--label-color) 24%, transparent),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-font-smoothing: antialiased;
            text-rendering: geometricPrecision;
        }

        .runtime-node-label::before {
            content: "";
            position: absolute;
            left: 12px;
            top: -1px;
            width: 34px;
            height: 2px;
            border-radius: 999px;
            background: var(--label-color);
            box-shadow: 0 0 14px var(--label-color);
        }

        .runtime-node-label strong {
            display: block;
            overflow: hidden;
            color: #f8fafc;
            font-size: 12px;
            line-height: 1.15;
            font-weight: 950;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.42);
        }

        .runtime-node-label span {
            display: block;
            overflow: hidden;
            margin-top: 3px;
            color: var(--label-color);
            font-size: 10px;
            line-height: 1.18;
            font-weight: 850;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .runtime-node-label.is-actionable {
            min-width: 144px;
            max-width: 206px;
            padding-right: 58px;
        }

        .runtime-node-start-button {
            position: absolute;
            top: 50%;
            right: 8px;
            min-width: 42px;
            height: 24px;
            transform: translateY(-50%);
            border: 1px solid color-mix(in srgb, var(--label-color) 72%, transparent);
            border-radius: 6px;
            color: #ecfeff;
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--label-color) 32%, transparent), rgba(2, 8, 18, 0.88));
            box-shadow: 0 0 14px color-mix(in srgb, var(--label-color) 22%, transparent);
            cursor: pointer;
            font-size: 10px;
            font-weight: 950;
            line-height: 1;
            pointer-events: auto;
            transition: transform 160ms ease, border-color 160ms ease, opacity 160ms ease;
        }

        .runtime-node-start-button:hover {
            transform: translateY(-50%) scale(1.04);
            border-color: color-mix(in srgb, var(--label-color) 92%, #ffffff);
        }

        .runtime-node-start-button:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--label-color) 82%, #ffffff);
            outline-offset: 2px;
        }

        .runtime-node-start-button:disabled {
            cursor: progress;
            opacity: 0.68;
            transform: translateY(-50%);
        }

        .runtime-node-label[data-state="DOWN"] {
            background:
                linear-gradient(135deg, rgba(251, 113, 133, 0.18), transparent 44%),
                rgba(18, 8, 14, 0.9);
        }

        .runtime-node-label[data-layer="内核"] {
            min-width: 128px;
        }

        .runtime-start-toast {
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 4;
            max-width: min(360px, calc(100% - 36px));
            padding: 10px 12px;
            border: 1px solid rgba(52, 211, 153, 0.46);
            border-radius: 8px;
            color: #d1fae5;
            background: rgba(2, 8, 18, 0.92);
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.34), 0 0 18px rgba(52, 211, 153, 0.16);
            font-size: 12px;
            font-weight: 800;
            line-height: 1.35;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .runtime-start-toast.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .runtime-start-toast.is-error {
            border-color: rgba(251, 113, 133, 0.52);
            color: #ffe4e6;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.34), 0 0 18px rgba(251, 113, 133, 0.15);
        }

        .runtime-visual-hud {
            position: absolute;
            inset: 18px;
            z-index: 2;
            display: grid;
            grid-template-columns: minmax(210px, 0.42fr) minmax(0, 1fr);
            align-items: start;
            gap: 16px;
            pointer-events: none;
        }

        .runtime-visual-title {
            max-width: 270px;
        }

        .runtime-visual-title h2 {
            line-height: 1.08;
        }

        .runtime-visual-title p {
            margin-top: 6px;
        }

        .runtime-twin-flow-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 8px 0 10px;
            padding: 0;
            list-style: none;
        }

        .runtime-twin-flow-strip span {
            min-height: 26px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border: 1px solid rgba(125, 211, 252, 0.22);
            border-radius: 999px;
            color: #dff8ff;
            background: rgba(2, 8, 18, 0.72);
            font-size: 11px;
            font-weight: 800;
        }

        .runtime-twin-flow-strip .is-upstream {
            color: #93c5fd;
            border-color: rgba(56, 189, 248, 0.4);
        }

        .runtime-twin-flow-strip .is-core {
            color: #86efac;
            border-color: rgba(74, 222, 128, 0.42);
        }

        .runtime-twin-flow-strip .is-downstream {
            color: #fde68a;
            border-color: rgba(251, 191, 36, 0.42);
        }

        .runtime-visual-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .runtime-visual-status-stack {
            min-width: 0;
            display: grid;
            gap: 7px;
            justify-items: end;
        }

        .runtime-visual-badge {
            min-height: 30px;
            max-width: 180px;
            padding: 7px 10px;
            border: 1px solid rgba(125, 211, 252, 0.22);
            border-radius: 999px;
            color: #dff8ff;
            background: rgba(3, 10, 20, 0.72);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
            font-size: 12px;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .runtime-visual-badge.is-ok {
            color: #bbf7d0;
            border-color: rgba(52, 211, 153, 0.42);
        }

        .runtime-visual-badge.is-danger {
            color: #fecdd3;
            border-color: rgba(251, 113, 133, 0.44);
        }

        .runtime-visual-badge.is-warning {
            color: #fef08a;
            border-color: rgba(250, 204, 21, 0.42);
        }

        .runtime-twin-layer-legend {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 14px;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            pointer-events: none;
        }

        .runtime-twin-layer-legend span {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border: 1px solid rgba(125, 211, 252, 0.22);
            border-radius: 8px;
            background: rgba(2, 8, 18, 0.64);
            color: #dff8ff;
            font-size: 11px;
            font-weight: 900;
            line-height: 1.2;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .runtime-twin-layer-legend i {
            flex: 0 0 auto;
            color: #67e8f9;
        }

        @media (max-width: 1080px) {
            .runtime-top,
            .runtime-main-grid,
            .runtime-metrics,
            .runtime-service-metrics {
                grid-template-columns: 1fr;
            }

            .runtime-model-panel,
            .runtime-model-services {
                grid-template-columns: 1fr !important;
            }

            .runtime-clock {
                text-align: left;
            }

            .runtime-visual-stage {
                min-height: 520px;
            }

            .runtime-visual-hud {
                grid-template-columns: 1fr;
            }

            .runtime-visual-status-stack,
            .runtime-visual-badges {
                justify-items: start;
                justify-content: flex-start;
            }

            .runtime-visual-title {
                max-width: min(100%, 420px);
            }

            .runtime-twin-layer-legend {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .runtime-node-label {
                min-width: 86px;
                max-width: 128px;
                padding: 6px 8px;
            }

            .runtime-node-label.is-actionable {
                min-width: 118px;
                max-width: 154px;
                padding-right: 52px;
            }

            .runtime-node-label strong {
                font-size: 11px;
            }

            .runtime-node-label span {
                font-size: 9px;
            }

            .runtime-node-start-button {
                right: 6px;
                min-width: 38px;
                height: 22px;
                font-size: 9px;
            }
        }

        body[data-app-page="service-dashboard"] .runtime-visual-stage {
            min-height: 0 !important;
            height: 100% !important;
        }

        @media (max-width: 1080px) {
            body[data-app-page="service-dashboard"] .runtime-visual-stage {
                min-height: 360px !important;
                height: 360px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-950 font-inter text-slate-100">
<header></header>

<main class="runtime-screen runtime-dashboard-workbench mx-auto px-4 py-5">
    <section class="runtime-panel runtime-model-panel runtime-model-strip runtime-log-panel p-4">
        <div class="runtime-model-head">
            <div>
                <h2 class="text-lg font-black text-white">模型服务</h2>
            </div>
            <span id="screen-model-health" class="rounded border border-cyan-400/30 px-3 py-1 text-xs font-bold text-cyan-100">读取中</span>
        </div>
        <div id="screen-model-services" class="runtime-model-services runtime-model-chip-row">
            <div class="rounded border border-dashed border-slate-600 p-4 text-sm text-slate-400">正在读取模型服务状态...</div>
        </div>
    </section>

    <section class="runtime-dashboard-main">
        <section class="runtime-visual-stage runtime-twin-facility" aria-label="立体孪生设施流向可视化">
            <canvas id="runtime-visual-canvas"></canvas>
            <div id="runtime-node-label-layer" class="runtime-node-label-layer"></div>
            <div id="runtime-start-toast" class="runtime-start-toast" role="status" aria-live="polite"></div>
            <div class="runtime-visual-hud">
                <div class="runtime-visual-title">
                    <p class="text-xs font-black uppercase tracking-[0.24em] text-cyan-300">Digital Twin</p>
                    <h2 class="mt-2 text-2xl font-black text-white">数字孪生脉冲</h2>
                    <p class="text-sm text-slate-400">接入 → 内核 → 模型 → 回流</p>
                    <div class="runtime-twin-flow-strip" aria-label="数字孪生上下游流向">
                        <span class="is-upstream"><i class="fa fa-arrow-right"></i> 接入</span>
                        <span class="is-core"><i class="fa fa-sitemap"></i> 内核</span>
                        <span class="is-downstream"><i class="fa fa-random"></i> 模型</span>
                        <span class="is-downstream"><i class="fa fa-arrow-left"></i> 回流</span>
                    </div>
                </div>
                <div class="runtime-visual-status-stack">
                    <div class="runtime-visual-badges">
                        <span id="visual-deploy-badge" class="runtime-visual-badge">部署 --</span>
                        <span id="visual-service-badge" class="runtime-visual-badge">服务 --</span>
                        <span id="visual-model-summary-badge" class="runtime-visual-badge">模型服务 --</span>
                    </div>
                </div>
            </div>
            <div class="runtime-twin-layer-legend" aria-hidden="true">
                <span><i class="fa fa-sign-in"></i> 接入</span>
                <span><i class="fa fa-sitemap"></i> 内核</span>
                <span><i class="fa fa-magic"></i> 模型</span>
                <span><i class="fa fa-server"></i> 回流</span>
            </div>
        </section>

        <section class="runtime-panel runtime-canvas-panel p-5">
            <div class="runtime-panel-head">
                <div>
                    <h2 class="text-xl font-black text-white">服务运行状态</h2>
                    <p class="mt-1 text-sm text-slate-400">CPU / 线程 / 内存 / GC / 磁盘 / 延迟</p>
                </div>
                <span id="service-runtime-health" class="rounded border border-cyan-400/30 px-3 py-1 text-xs font-bold text-cyan-100">读取中</span>
            </div>
            <div class="runtime-metrics-canvas-wrap">
                <canvas id="runtime-metrics-canvas" aria-label="运行指标 Canvas">CPU 负载、线程数、堆内存、GC 次数、磁盘可用、健康延迟</canvas>
            </div>
        </section>
    </section>

</main>

<script>
    let runtimeTimer = null;
    let runtimeAnimationFrame = null;
    let runtimeMetricsAnimationFrame = null;
    let runtimeNodeLabelKey = '';
    let runtimeStartToastTimer = null;
    const runtimeModelServiceStartState = {
        inFlight: new Set()
    };
    const runtimeVisualState = {
        deploymentState: 'UNKNOWN',
        serviceReachable: false,
        dockerAvailable: false,
        memoryUsagePercent: 0,
        modelServices: [],
        containers: [],
        updatedAt: 0
    };
    const runtimeMetricCanvasState = {
        updatedAt: 0,
        items: [
            { label: 'CPU 负载', value: '--', detail: '系统 CPU --', ratio: 0, color: '#22d3ee', invert: false },
            { label: '线程数', value: '--', detail: '守护线程 -- / 峰值 --', ratio: 0, color: '#38bdf8', invert: false },
            { label: '堆内存', value: '--', detail: '非堆 --', ratio: 0, color: '#a78bfa', invert: false },
            { label: 'GC 次数', value: '--', detail: '耗时 -- ms', ratio: 0, color: '#fbbf24', invert: false },
            { label: '磁盘可用', value: '--', detail: '使用率 --', ratio: 1, color: '#34d399', invert: true },
            { label: '健康延迟', value: '--', detail: '加载类 --', ratio: 0, color: '#2dd4bf', invert: false }
        ]
    };

    function refreshRuntimeDashboard() {
        fetch('/api/deploy/status')
            .then(response => response.json())
            .then(payload => {
                if (!payload.success) {
                    renderRuntimeError(payload.message || '获取运行状态失败');
                    return;
                }
                renderRuntimeDashboard(payload.data || payload);
            })
            .catch(error => renderRuntimeError(error.message));
    }

    function handleModelServiceStartClick(event) {
        const target = event.target instanceof Element ? event.target : event.target?.parentElement;
        const button = target?.closest('[data-model-service-start]');
        if (!button) {
            return;
        }
        event.preventDefault();
        event.stopPropagation();

        const serviceId = button.getAttribute('data-model-service-start');
        if (!serviceId || runtimeModelServiceStartState.inFlight.has(serviceId)) {
            return;
        }

        runtimeModelServiceStartState.inFlight.add(serviceId);
        runtimeNodeLabelKey = '';
        updateModelServiceStartButtons(serviceId, '启动中', true);

        fetch('/api/deploy/model-service/start', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ serviceId })
        })
            .then(response => response.json())
            .then(payload => {
                const success = Boolean(payload.success);
                showRuntimeStartToast(payload.message || (success ? '启动请求已提交' : '启动失败'), success);
            })
            .catch(error => {
                showRuntimeStartToast(error.message || '启动请求失败', false);
            })
            .finally(() => {
                runtimeModelServiceStartState.inFlight.delete(serviceId);
                runtimeNodeLabelKey = '';
                updateModelServiceStartButtons(serviceId, '启动', false);
                setTimeout(refreshRuntimeDashboard, 800);
            });
    }

    function updateModelServiceStartButtons(serviceId, text, disabled) {
        document.querySelectorAll('[data-model-service-start]').forEach(button => {
            if (button.getAttribute('data-model-service-start') !== serviceId) {
                return;
            }
            button.textContent = text;
            button.disabled = disabled;
        });
    }

    function showRuntimeStartToast(message, success) {
        const toast = document.getElementById('runtime-start-toast');
        if (!toast) {
            return;
        }
        toast.textContent = message;
        toast.classList.toggle('is-error', !success);
        toast.classList.add('is-visible');
        if (runtimeStartToastTimer) {
            clearTimeout(runtimeStartToastTimer);
        }
        runtimeStartToastTimer = setTimeout(() => {
            toast.classList.remove('is-visible');
        }, 2600);
    }

    function renderRuntimeDashboard(status) {
        updateRuntimeVisualState(status);
        renderServiceRuntimeMetrics(status.serviceMetrics || {});
        renderModelServices(status.modelServices || []);
    }

    function renderServiceRuntimeMetrics(metrics) {
        const cpu = formatPercent(metrics.processCpuLoadPercent);
        const systemCpu = formatPercent(metrics.systemCpuLoadPercent);
        const threadPeak = Number(metrics.peakThreadCount || metrics.threadCount || 0);
        const threadCount = Number(metrics.threadCount || 0);
        const diskUsage = Number(metrics.diskUsagePercent || 0);
        const healthLatency = Number(metrics.healthLatencyMs || 0);
        runtimeMetricCanvasState.updatedAt = Date.now();
        runtimeMetricCanvasState.items = [
            {
                label: 'CPU 负载',
                value: cpu,
                detail: '系统 CPU ' + systemCpu,
                ratio: normalizeRatio(metrics.processCpuLoadPercent, 100),
                color: '#22d3ee',
                invert: false
            },
            {
                label: '线程数',
                value: String(metrics.threadCount ?? '--'),
                detail: `守护线程 ${metrics.daemonThreadCount ?? '--'} / 峰值 ${metrics.peakThreadCount ?? '--'}`,
                ratio: threadPeak > 0 ? Math.min(threadCount / threadPeak, 1) : 0,
                color: '#38bdf8',
                invert: false
            },
            {
                label: '堆内存',
                value: `${metrics.heapUsagePercent ?? 0}%`,
                detail: `非堆 ${metrics.nonHeapUsedMb ?? 0} MB`,
                ratio: normalizeRatio(metrics.heapUsagePercent, 100),
                color: Number(metrics.heapUsagePercent || 0) > 80 ? '#fb7185' : '#a78bfa',
                invert: false
            },
            {
                label: 'GC 次数',
                value: String(metrics.gcCount ?? 0),
                detail: `耗时 ${metrics.gcTimeMs ?? 0} ms`,
                ratio: normalizeRatio(metrics.gcCount, 100),
                color: '#fbbf24',
                invert: false
            },
            {
                label: '磁盘可用',
                value: `${metrics.diskUsableGb ?? 0} GB`,
                detail: `使用率 ${metrics.diskUsagePercent ?? 0}%`,
                ratio: normalizeRatio(100 - diskUsage, 100),
                color: diskUsage > 85 ? '#fb7185' : '#34d399',
                invert: true
            },
            {
                label: '健康延迟',
                value: formatLatency(metrics.healthLatencyMs),
                detail: `加载类 ${metrics.loadedClassCount ?? 0}`,
                ratio: normalizeRatio(healthLatency, 1000),
                color: healthLatency > 500 ? '#fb7185' : '#2dd4bf',
                invert: false
            }
        ];

        const healthy = runtimeVisualState.serviceReachable
            && Number(metrics.heapUsagePercent || 0) < 85
            && Number(metrics.diskUsagePercent || 0) < 90;
        const health = document.getElementById('service-runtime-health');
        health.textContent = healthy ? '运行正常' : '需要关注';
        health.classList.toggle('text-emerald-100', healthy);
        health.classList.toggle('text-rose-100', !healthy);
    }

    function normalizeRatio(value, max) {
        const number = Number(value);
        if (!Number.isFinite(number) || number < 0) {
            return 0;
        }
        return Math.max(0, Math.min(number / max, 1));
    }

    function updateRuntimeVisualState(status) {
        runtimeVisualState.deploymentState = status.deploymentState || 'UNKNOWN';
        runtimeVisualState.serviceReachable = Boolean(status.serviceReachable);
        runtimeVisualState.dockerAvailable = Boolean(status.dockerAvailable);
        runtimeVisualState.memoryUsagePercent = Number(status.memoryUsagePercent || 0);
        runtimeVisualState.modelServices = Array.isArray(status.modelServices) ? status.modelServices : [];
        runtimeVisualState.containers = status.containers || [];
        runtimeVisualState.updatedAt = Date.now();

        updateVisualBadge('visual-deploy-badge', '部署 ' + runtimeVisualState.deploymentState, runtimeVisualState.deploymentState === 'SUCCEEDED');
        updateVisualBadge('visual-service-badge', '服务 ' + (runtimeVisualState.serviceReachable ? 'UP' : 'DOWN'), runtimeVisualState.serviceReachable);
        renderModelServiceVisualBadges(runtimeVisualState.modelServices);
    }

    function updateVisualBadge(id, text, ok) {
        const badge = document.getElementById(id);
        if (!badge) {
            return;
        }
        badge.textContent = text;
        badge.classList.toggle('is-ok', ok);
        badge.classList.toggle('is-danger', !ok);
    }

    function renderModelServices(modelServices) {
        const container = document.getElementById('screen-model-services');
        const health = document.getElementById('screen-model-health');
        if (!container) {
            return;
        }
        if (!modelServices.length) {
            container.innerHTML = '<div class="rounded border border-dashed border-slate-600 p-4 text-sm text-slate-400">暂无模型服务状态</div>';
            if (health) {
                health.textContent = '无数据';
            }
            return;
        }

        const upCount = modelServices.filter(item => item.state === 'UP').length;
        const degradedCount = modelServices.filter(item => item.state === 'DEGRADED').length;
        if (health) {
            health.textContent = `${upCount}/${modelServices.length} 可用${degradedCount ? ` · ${degradedCount} 待配置` : ''}`;
        }

        container.innerHTML = modelServices.map(item => {
            const state = String(item.state || 'UNKNOWN');
            const stateClass = state === 'UP'
                ? 'is-up'
                : state === 'DEGRADED'
                    ? 'is-degraded'
                    : 'is-down';
            const serviceName = String(item.name || item.id || '模型服务')
                .replace('Stable Diffusion / Forge', 'SD/Forge')
                .replace('Ollama 本地模型', 'Ollama')
                .replace('Wan2.1 视频桥', 'Wan2.1');
            return `
                <article class="runtime-model-chip ${stateClass}">
                    <strong>${escapeHtml(serviceName)}</strong>
                    <span>${escapeHtml(state)} · ${escapeHtml(String(item.port || '--'))} · ${formatLatency(item.latencyMs)}</span>
                </article>
            `;
        }).join('');
    }

    function renderRuntimeError(message) {
        renderModelServices([]);
        updateRuntimeVisualState({
            deploymentState: 'FAILED',
            serviceReachable: false,
            dockerAvailable: false,
            memoryUsagePercent: runtimeVisualState.memoryUsagePercent,
            containers: runtimeVisualState.containers,
            modelServices: []
        });
    }

    function renderModelServiceVisualBadges(modelServices) {
        const summaryBadge = document.getElementById('visual-model-summary-badge');
        const services = Array.isArray(modelServices) ? modelServices : [];
        if (!summaryBadge) {
            return;
        }

        if (!services.length) {
            summaryBadge.textContent = '模型服务 --';
            summaryBadge.className = 'runtime-visual-badge';
            return;
        }

        const upCount = services.filter(item => String(item.state || '').toUpperCase() === 'UP').length;
        const degradedCount = services.filter(item => String(item.state || '').toUpperCase() === 'DEGRADED').length;
        const downCount = services.length - upCount - degradedCount;
        summaryBadge.textContent = `模型服务 ${upCount}/${services.length}`;
        summaryBadge.className = 'runtime-visual-badge';
        summaryBadge.classList.toggle('is-ok', downCount === 0 && degradedCount === 0);
        summaryBadge.classList.toggle('is-warning', downCount === 0 && degradedCount > 0);
        summaryBadge.classList.toggle('is-danger', downCount > 0);
    }

    function startRuntimeCanvas() {
        const canvas = document.getElementById('runtime-visual-canvas');
        if (!canvas) {
            return;
        }
        const context = canvas.getContext('2d');
        const resizeObserver = new ResizeObserver(function () {
            resizeRuntimeCanvas(canvas, 3);
        });
        resizeObserver.observe(canvas);
        resizeRuntimeCanvas(canvas, 3);

        function animate(timestamp) {
            drawRuntimeVisualization(context, canvas, timestamp);
            runtimeAnimationFrame = requestAnimationFrame(animate);
        }

        runtimeAnimationFrame = requestAnimationFrame(animate);
    }

    function startRuntimeMetricsCanvas() {
        const canvas = document.getElementById('runtime-metrics-canvas');
        if (!canvas) {
            return;
        }
        const context = canvas.getContext('2d');
        const resizeObserver = new ResizeObserver(function () {
            resizeRuntimeCanvas(canvas, 2);
        });
        resizeObserver.observe(canvas);
        resizeRuntimeCanvas(canvas, 2);

        function animate(timestamp) {
            drawRuntimeMetricsCanvas(context, canvas, timestamp);
            runtimeMetricsAnimationFrame = requestAnimationFrame(animate);
        }

        runtimeMetricsAnimationFrame = requestAnimationFrame(animate);
    }

    function resizeRuntimeCanvas(canvas, maxPixelRatio = 2) {
        const rect = canvas.getBoundingClientRect();
        const pixelRatio = Math.min(Math.max(window.devicePixelRatio || 1, 1), maxPixelRatio);
        const width = Math.max(Math.floor(rect.width * pixelRatio), 1);
        const height = Math.max(Math.floor(rect.height * pixelRatio), 1);
        if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
        }
        canvas.dataset.pixelRatio = String(pixelRatio);
    }

    function drawRuntimeVisualization(context, canvas, timestamp) {
        const width = canvas.width;
        const height = canvas.height;
        const scale = Number(canvas.dataset.pixelRatio || Math.min(window.devicePixelRatio || 1, 3));
        const time = timestamp / 1000;
        context.clearRect(0, 0, width, height);
        context.save();
        context.scale(scale, scale);
        renderRuntimeTopology(context, width / scale, height / scale, time);
        context.restore();
    }

    function drawRuntimeMetricsCanvas(context, canvas, timestamp) {
        if (canvas.offsetParent === null || canvas.width < 24 || canvas.height < 24) {
            return;
        }
        const width = canvas.width;
        const height = canvas.height;
        const scale = Number(canvas.dataset.pixelRatio || Math.min(window.devicePixelRatio || 1, 2));
        const time = timestamp / 1000;
        context.clearRect(0, 0, width, height);
        context.save();
        context.scale(scale, scale);
        renderRuntimeMetricBoard(context, width / scale, height / scale, time);
        context.restore();
    }

    function renderRuntimeMetricBoard(context, width, height, time) {
        const items = runtimeMetricCanvasState.items;
        if (!items.length || width < 24 || height < 24) {
            return;
        }
        const columns = resolveMetricBoardColumns(width, height, items.length);
        const rows = Math.ceil(items.length / columns);
        const gap = 10;
        const cardWidth = (width - gap * (columns - 1)) / columns;
        const cardHeight = (height - gap * (rows - 1)) / rows;

        drawMetricBoardBackground(context, width, height, time);
        items.forEach((item, index) => {
            const column = index % columns;
            const row = Math.floor(index / columns);
            const x = column * (cardWidth + gap);
            const y = row * (cardHeight + gap);
            renderMetricGauge(context, item, x, y, cardWidth, cardHeight, time + index * 0.33);
        });
    }

    function resolveMetricBoardColumns(width, height, count) {
        if (count <= 1) {
            return 1;
        }
        if (height < 210 && width >= 360) {
            return Math.min(3, count);
        }
        if (width >= 360) {
            return Math.min(2, count);
        }
        return 1;
    }

    function drawMetricBoardBackground(context, width, height, time) {
        context.save();
        const gradient = context.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, 'rgba(34, 211, 238, 0.08)');
        gradient.addColorStop(0.55, 'rgba(15, 23, 42, 0.12)');
        gradient.addColorStop(1, 'rgba(52, 211, 153, 0.06)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);

        context.strokeStyle = 'rgba(125, 211, 252, 0.06)';
        context.lineWidth = 1;
        for (let x = 0; x < width; x += 28) {
            context.beginPath();
            context.moveTo(x + Math.sin(time + x) * 2, 0);
            context.lineTo(x, height);
            context.stroke();
        }
        context.restore();
    }

    function renderMetricGauge(context, item, x, y, width, height, time) {
        if (height < 72 || width < 170) {
            renderCompactMetricGauge(context, item, x, y, width, height, time);
            return;
        }

        const pad = Math.max(10, Math.min(14, height * 0.13));
        const radius = Math.max(16, Math.min(24, (height - pad * 2) * 0.34));
        const cx = x + pad + radius;
        const cy = y + height / 2 + 2;
        const ratio = Math.max(0, Math.min(item.ratio || 0, 1));
        const pulse = 0.5 + Math.sin(time * 2.4) * 0.12;
        const textX = cx + radius + pad;
        const textWidth = Math.max(70, x + width - pad - textX);
        const valueColumnWidth = Math.max(70, Math.min(textWidth, width * 0.58));
        const labelY = y + pad + 13;
        const valueY = y + height * 0.52 + 8;
        const detailY = y + height - pad - 2;
        const valueFontSize = Math.max(18, Math.min(24, height * 0.23));

        context.save();
        context.fillStyle = 'rgba(2, 8, 18, 0.68)';
        context.strokeStyle = 'rgba(125, 211, 252, 0.18)';
        roundRect(context, x + 0.5, y + 0.5, width - 1, height - 1, 8);
        context.fill();
        context.stroke();

        context.fillStyle = item.color;
        context.globalAlpha = 0.85;
        context.fillRect(x + pad, y + pad, Math.max(22, width * 0.2), 2);
        context.globalAlpha = 1;

        context.shadowColor = item.color;
        context.shadowBlur = 12;
        context.strokeStyle = 'rgba(125, 211, 252, 0.18)';
        context.lineWidth = 7;
        context.beginPath();
        context.arc(cx, cy, radius, -Math.PI * 0.72, Math.PI * 0.72);
        context.stroke();

        context.strokeStyle = item.color;
        context.lineCap = 'round';
        context.beginPath();
        const start = -Math.PI * 0.72;
        const end = start + Math.PI * 1.44 * ratio;
        context.arc(cx, cy, radius, start, end);
        context.stroke();

        context.fillStyle = item.color;
        context.globalAlpha = 0.9;
        context.beginPath();
        context.arc(cx, cy, 3 + pulse * 1.5, 0, Math.PI * 2);
        context.fill();

        context.shadowBlur = 0;
        context.globalAlpha = 1;
        context.textAlign = 'left';
        context.fillStyle = '#9fb5c9';
        context.font = '800 11px system-ui, sans-serif';
        drawMetricText(context, item.label, textX, labelY, textWidth);
        context.fillStyle = '#f8fafc';
        context.font = `900 ${valueFontSize}px system-ui, sans-serif`;
        drawMetricText(context, item.value, textX, valueY, valueColumnWidth);
        context.fillStyle = item.invert ? '#bbf7d0' : '#9fb5c9';
        context.font = '11px system-ui, sans-serif';
        drawMetricText(context, item.detail, textX, detailY, textWidth);
        context.restore();
    }

    function renderCompactMetricGauge(context, item, x, y, width, height, time) {
        if (width <= 2 || height <= 2) {
            return;
        }
        const pad = 8;
        const ratio = Math.max(0, Math.min(item.ratio || 0, 1));
        const barWidth = Math.max(20, width - pad * 2);
        const pulse = 0.5 + Math.sin(time * 2.4) * 0.14;

        context.save();
        context.fillStyle = 'rgba(2, 8, 18, 0.7)';
        context.strokeStyle = 'rgba(125, 211, 252, 0.18)';
        roundRect(context, x + 0.5, y + 0.5, width - 1, height - 1, 7);
        context.fill();
        context.stroke();

        context.fillStyle = item.color;
        context.globalAlpha = 0.86;
        context.beginPath();
        context.arc(x + width - pad - 7, y + pad + 7, 3.5 + pulse, 0, Math.PI * 2);
        context.fill();
        context.globalAlpha = 1;

        context.textAlign = 'left';
        context.fillStyle = '#9fb5c9';
        context.font = '800 10px system-ui, sans-serif';
        drawMetricText(context, item.label, x + pad, y + 18, width - pad * 3 - 16);
        context.fillStyle = '#f8fafc';
        context.font = '900 17px system-ui, sans-serif';
        drawMetricText(context, item.value, x + pad, y + Math.min(43, height - 18), width - pad * 2);

        context.strokeStyle = 'rgba(125, 211, 252, 0.16)';
        context.lineWidth = 4;
        context.lineCap = 'round';
        context.beginPath();
        context.moveTo(x + pad, y + height - 9);
        context.lineTo(x + pad + barWidth, y + height - 9);
        context.stroke();
        context.strokeStyle = item.color;
        context.beginPath();
        context.moveTo(x + pad, y + height - 9);
        context.lineTo(x + pad + barWidth * ratio, y + height - 9);
        context.stroke();
        context.restore();
    }

    function drawMetricText(context, text, x, y, maxWidth) {
        const value = String(text ?? '--');
        if (context.measureText(value).width <= maxWidth) {
            context.fillText(value, x, y);
            return;
        }

        let output = value;
        while (output.length > 1 && context.measureText(output + '...').width > maxWidth) {
            output = output.slice(0, -1);
        }
        context.fillText(output + '...', x, y);
    }

    function roundRect(context, x, y, width, height, radius) {
        if (width <= 0 || height <= 0) {
            return;
        }
        const r = Math.max(0, Math.min(radius, width / 2, height / 2));
        context.beginPath();
        context.moveTo(x + r, y);
        context.arcTo(x + width, y, x + width, y + height, r);
        context.arcTo(x + width, y + height, x, y + height, r);
        context.arcTo(x, y + height, x, y, r);
        context.arcTo(x, y, x + width, y, r);
        context.closePath();
    }

    function renderRuntimeTopology(context, width, height, time) {
        renderRuntimeDigitalTwinScene(context, width, height, time);
    }

    function renderRuntimeDigitalTwinScene(context, width, height, time) {
        const compact = width < 720;

            x: width * 0.5,
            y: compact ? height * 0.66 : height * 0.67,
            width: Math.min(width * 0.9, compact ? 560 : 820),
            depth: Math.min(height * 0.46, compact ? 250 : 310)
        };
        const upstreamNodes = [
            {
                x: base.x - base.width * 0.36,
                y: base.y - base.depth * 0.1,
                label: '上游请求',
                sub: 'Client/API',
                color: '#67e8f9',
                state: runtimeVisualState.serviceReachable ? 'UP' : 'DOWN',
                layer: '接入'
            },
            {
                x: base.x - base.width * 0.27,
                y: base.y + base.depth * 0.08,
                label: '网关回放',
                sub: runtimeVisualState.dockerAvailable ? 'Docker Ready' : 'Docker ERR',
                color: dockerColor,
                state: runtimeVisualState.dockerAvailable ? 'UP' : 'DOWN',
                layer: '接入'
            }

        const coreNode = {

            color: okColor,
            state: runtimeVisualState.serviceReachable ? 'UP' : 'DOWN',
            layer: '内核'
        };
        const dockerNode = {
            x: base.x - base.width * 0.14,
            y: base.y - base.depth * 0.3,
            label: 'Docker',
            sub: runtimeVisualState.dockerAvailable ? 'available' : 'error',
            color: dockerColor,
            state: runtimeVisualState.dockerAvailable ? 'UP' : 'DOWN',
            layer: '内核'
        };
        const jvmNode = {
            x: base.x + base.width * 0.34,
            y: base.y - base.depth * 0.03,

            layer: '回流'
        };
        const modelNodes = digitalTwinModelNodes(base).map(node => ({ ...node, layer: '模型' }));

        const labelNodes = [
            ...upstreamNodes.map(node => ({ ...node, labelY: node.y + (compact ? 38 : 44) })),
            { ...dockerNode, labelY: dockerNode.y + (compact ? 32 : 38) },
            { ...coreNode, labelY: coreNode.y + (compact ? 68 : 82) },
            ...modelNodes.map(node => ({ ...node, labelY: node.y + (compact ? 34 : 42) })),
            { ...jvmNode, labelY: jvmNode.y + (compact ? 54 : 64) },
            ...containerTwinNodes.map(node => ({ ...node, labelY: node.y + (compact ? 34 : 42) }))
        ];

        drawStarfield(context, width, height, time);
        drawTwinBasePlate(context, base, time);
        drawTwinLayerDecks(context, base, time);
        drawTwinLayerLabel(context, '接入', base.x - base.width * 0.42, base.y - base.depth * 0.42, '#67e8f9');
        drawTwinLayerLabel(context, '内核', base.x - base.width * 0.04, base.y - base.depth * 0.48, okColor);
        drawTwinLayerLabel(context, '模型', base.x + base.width * 0.21, base.y - base.depth * 0.43, '#fbbf24');
        drawTwinLayerLabel(context, '回流', base.x + base.width * 0.36, base.y + base.depth * 0.28, '#a78bfa');
        syncRuntimeNodeLabels(width, height, labelNodes, compact);

        upstreamNodes.forEach((node, index) => {
            drawTwinFlowLane(context, node, coreNode, time + index * 0.38, node.state, { curve: compact ? -34 : -54 });
        });
        drawTwinFlowLane(context, dockerNode, coreNode, time + 0.7, dockerNode.state, { curve: -32, dashed: true });
        modelNodes.forEach((node, index) => {
            drawTwinFlowLane(context, coreNode, node, time + 0.45 + index * 0.24, node.state, { curve: index % 2 === 0 ? -44 : 34 });
            drawTwinFlowLane(context, node, jvmNode, time + 1.35 + index * 0.22, node.state, { curve: 34, dashed: true });
        });
        drawTwinFlowLane(context, coreNode, jvmNode, time + 1.1, jvmNode.state, { curve: -18, width: 2.4 });
        containerTwinNodes.forEach((node, index) => {

            drawTwinFlowLane(context, node, coreNode, time + 1.9 + index * 0.18, node.state, { curve: compact ? 46 : 70, reverse: true, dashed: true, width: 1.2 });
        });

        modelNodes.forEach((node, index) => drawTwinMiniServer(context, node, time + index * 0.2, { tone: 'model', minimal: compact }));

        drawTwinMiniServer(context, jvmNode, time, { tone: 'jvm', tall: true, minimal: compact });
        containerTwinNodes.forEach((node, index) => drawTwinMiniServer(context, node, time + index * 0.18, { tone: 'container', minimal: compact }));
    }

    function drawTwinBasePlate(context, base, time) {
        const points = [
            { x: base.x, y: base.y - base.depth * 0.55 },
            { x: base.x + base.width * 0.5, y: base.y },
            { x: base.x, y: base.y + base.depth * 0.55 },
            { x: base.x - base.width * 0.5, y: base.y }
        ];
        const side = points.map(point => ({ x: point.x, y: point.y + 18 }));
        context.save();
        context.beginPath();
        context.moveTo(points[1].x, points[1].y);
        context.lineTo(side[1].x, side[1].y);
        context.lineTo(side[2].x, side[2].y);
        context.lineTo(points[2].x, points[2].y);
        context.closePath();
        context.fillStyle = 'rgba(8, 47, 73, 0.72)';
        context.fill();

        const gradient = context.createLinearGradient(base.x - base.width * 0.42, base.y - base.depth * 0.44, base.x + base.width * 0.42, base.y + base.depth * 0.34);
        gradient.addColorStop(0, 'rgba(14, 165, 233, 0.22)');
        gradient.addColorStop(0.5, 'rgba(15, 23, 42, 0.88)');
        gradient.addColorStop(1, 'rgba(20, 184, 166, 0.16)');
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach(point => context.lineTo(point.x, point.y));
        context.closePath();
        context.fillStyle = gradient;
        context.fill();
        context.strokeStyle = 'rgba(103, 232, 249, 0.42)';
        context.lineWidth = 1.2;
        context.stroke();

        context.strokeStyle = 'rgba(125, 211, 252, 0.12)';
        context.lineWidth = 1;
        for (let ratio = -0.38; ratio <= 0.38; ratio += 0.095) {
            context.beginPath();
            context.moveTo(base.x + ratio * base.width, base.y - base.depth * 0.45 + Math.sin(time + ratio * 10) * 1.5);
            context.lineTo(base.x + ratio * base.width + base.width * 0.31, base.y + base.depth * 0.18);
            context.stroke();
            context.beginPath();
            context.moveTo(base.x + ratio * base.width, base.y + base.depth * 0.45);
            context.lineTo(base.x + ratio * base.width + base.width * 0.31, base.y - base.depth * 0.18);
            context.stroke();
        }

        context.strokeStyle = 'rgba(34, 211, 238, 0.28)';
        context.lineWidth = 2;
        context.beginPath();
        context.ellipse(base.x, base.y + 3, base.width * 0.25, base.depth * 0.18, 0, 0, Math.PI * 2);
        context.stroke();
        context.restore();
    }

    function drawTwinLayerDecks(context, base, time) {
        const decks = [
            {
                layer: '接入',
                color: '#67e8f9',
                x: base.x - base.width * 0.31,
                y: base.y - base.depth * 0.04,
                width: base.width * 0.3,
                depth: base.depth * 0.34
            },
            {
                layer: '内核',
                color: runtimeVisualState.serviceReachable ? '#34d399' : '#fb7185',
                x: base.x - base.width * 0.03,
                y: base.y - base.depth * 0.08,
                width: base.width * 0.26,
                depth: base.depth * 0.34
            },
            {
                layer: '模型',
                color: '#fbbf24',
                x: base.x + base.width * 0.2,
                y: base.y - base.depth * 0.04,
                width: base.width * 0.28,
                depth: base.depth * 0.34
            },
            {
                layer: '回流',
                color: '#a78bfa',
                x: base.x + base.width * 0.31,
                y: base.y + base.depth * 0.21,
                width: base.width * 0.3,
                depth: base.depth * 0.3
            }
        ];

        context.save();
        decks.forEach((deck, index) => drawTwinDeck(context, deck, time + index * 0.45));
        context.restore();
    }

    function drawTwinDeck(context, deck, time) {
        const pulse = 0.08 + Math.sin(time * 1.6) * 0.018;
        const points = [
            { x: deck.x, y: deck.y - deck.depth * 0.5 },
            { x: deck.x + deck.width * 0.5, y: deck.y },
            { x: deck.x, y: deck.y + deck.depth * 0.5 },
            { x: deck.x - deck.width * 0.5, y: deck.y }
        ];

        context.save();
        context.shadowColor = deck.color;
        context.shadowBlur = 14;
        context.beginPath();
        context.moveTo(points[0].x, points[0].y);
        points.slice(1).forEach(point => context.lineTo(point.x, point.y));
        context.closePath();
        context.fillStyle = toRgba(deck.color, pulse);
        context.strokeStyle = toRgba(deck.color, 0.34);
        context.lineWidth = 1.1;
        context.fill();
        context.stroke();

        context.shadowBlur = 0;
        context.strokeStyle = toRgba(deck.color, 0.22);
        context.lineWidth = 1;
        for (let step = -0.25; step <= 0.25; step += 0.25) {
            context.beginPath();
            context.moveTo(deck.x + deck.width * step, deck.y - deck.depth * 0.38);
            context.lineTo(deck.x + deck.width * (step + 0.18), deck.y + deck.depth * 0.26);
            context.stroke();
        }
        context.restore();
    }

    function syncRuntimeNodeLabels(width, height, nodes, compact) {
        const layer = document.getElementById('runtime-node-label-layer');
        if (!layer || width <= 0 || height <= 0) {
            return;
        }
        const visibleNodes = (compact
            ? nodes.filter(node => node.layer === '内核' || node.layer === '模型' || node.label === 'JVM')
            : nodes
        ).slice(0, compact ? 6 : 12);
        const nextKey = `${Math.round(width)}x${Math.round(height)}|` + visibleNodes
            .map(node => [
                node.label,
                node.sub,
                node.layer,
                node.state,
                node.serviceId || '',
                node.canStart ? 'startable' : '',
                runtimeModelServiceStartState.inFlight.has(node.serviceId) ? 'starting' : '',
                Math.round(node.x),
                Math.round(node.labelY || node.y),
                node.color
            ].join(':'))
            .join('|');

        if (nextKey === runtimeNodeLabelKey) {
            return;
        }

        runtimeNodeLabelKey = nextKey;
        layer.innerHTML = renderRuntimeNodeLabels(visibleNodes, width, height);
    }

    function renderRuntimeNodeLabels(nodes, width, height) {
        return nodes.map(node => {
            const state = String(node.state || 'UNKNOWN').toUpperCase();
            const x = Math.max(4, Math.min(96, (node.x / width) * 100));
            const y = Math.max(8, Math.min(91, ((node.labelY || node.y) / height) * 100));
            const color = node.color || '#67e8f9';
            const serviceId = String(node.serviceId || '');
            const canStart = Boolean(node.canStart && serviceId && state !== 'UP');
            const starting = canStart && runtimeModelServiceStartState.inFlight.has(serviceId);
            const labelClass = `runtime-node-label${canStart ? ' is-actionable' : ''}${starting ? ' is-starting' : ''}`;
            const startButton = canStart
                ? `<button type="button"
                           class="runtime-node-start-button"
                           data-model-service-start="${escapeHtml(serviceId)}"
                           aria-label="启动${escapeHtml(node.label || '模型服务')}"
                           title="启动${escapeHtml(node.label || '模型服务')}"
                           ${starting ? 'disabled' : ''}>${starting ? '启动中' : '启动'}</button>`
                : '';
            return `
                <span class="${labelClass}"
                      data-state="${escapeHtml(state)}"
                      data-layer="${escapeHtml(node.layer || '')}"
                      style="--label-x:${x.toFixed(2)}; --label-y:${y.toFixed(2)}; --label-color:${escapeHtml(color)}">
                    <strong>${escapeHtml(node.label || '--')}</strong>
                    <span>${escapeHtml(node.sub || state)}</span>
                    ${startButton}
                </span>
            `;
        }).join('');
    }

    function drawTwinLayerLabel(context, label, x, y, color) {
        context.save();
        context.font = '800 11px system-ui, sans-serif';
        const width = Math.min(150, Math.max(76, context.measureText(label).width + 24));

        roundRect(context, x - width / 2, y - 13, width, 26, 8);
        context.fill();
        context.stroke();
        context.fillStyle = color;

        context.fillText(label, x, y + 4);
        context.restore();
    }

    function drawTwinCoreFacility(context, node, time, options = {}) {

        drawIsoBox(context, node.x, node.y + 28, 118, 70, 32, '#22d3ee', node.state);
        drawIsoBox(context, node.x, node.y + 1, 86, 54, 42, node.color, node.state);
        drawIsoBox(context, node.x, node.y - 32, 52, 34, 34, '#a78bfa', node.state);

        context.strokeStyle = node.color + 'aa';

        context.beginPath();
        context.ellipse(node.x, node.y - 26, 58 + Math.sin(time * 1.8) * 3, 22, 0, 0, Math.PI * 2);

        context.beginPath();
        context.moveTo(node.x, node.y - 82);
        context.lineTo(node.x, node.y - 112);
        context.stroke();

    function drawTwinMiniServer(context, node, time, options = {}) {
        const tall = Boolean(options.tall);
        const width = tall ? 74 : 58;
        const depth = tall ? 46 : 38;
        const height = tall ? 74 : 48;
        context.save();
        drawTwinGlow(context, node.x, node.y - height * 0.4, node.color, tall ? 62 : 46, node.state === 'UP' ? 0.22 : 0.16);
        drawIsoBox(context, node.x, node.y, width, depth, height, node.color, node.state);
        context.fillStyle = node.state === 'UP' ? '#34d399' : node.state === 'DEGRADED' ? '#fbbf24' : '#fb7185';
        context.beginPath();
        context.arc(node.x + width * 0.22, node.y - height * 0.42, 4 + Math.sin(time * 2.4) * 0.7, 0, Math.PI * 2);
        context.fill();
        context.restore();
    }

    function drawIsoBox(context, x, y, width, depth, height, color, state) {
        const top = [
            { x, y: y - height - depth * 0.5 },
            { x: x + width * 0.5, y: y - height },
            { x, y: y - height + depth * 0.5 },
            { x: x - width * 0.5, y: y - height }
        ];
        const bottom = top.map(point => ({ x: point.x, y: point.y + height }));
        const alpha = state === 'UP' ? 0.82 : state === 'DEGRADED' ? 0.72 : 0.58;
        context.save();
        context.shadowColor = color;
        context.shadowBlur = state === 'UP' ? 18 : 11;

        context.beginPath();
        context.moveTo(top[3].x, top[3].y);
        context.lineTo(top[2].x, top[2].y);
        context.lineTo(bottom[2].x, bottom[2].y);
        context.lineTo(bottom[3].x, bottom[3].y);
        context.closePath();
        context.fillStyle = `rgba(8, 47, 73, ${alpha})`;
        context.fill();

        context.beginPath();
        context.moveTo(top[1].x, top[1].y);
        context.lineTo(top[2].x, top[2].y);
        context.lineTo(bottom[2].x, bottom[2].y);
        context.lineTo(bottom[1].x, bottom[1].y);
        context.closePath();
        context.fillStyle = `rgba(15, 23, 42, ${alpha + 0.1})`;
        context.fill();

        const topGradient = context.createLinearGradient(x - width * 0.5, y - height - depth * 0.5, x + width * 0.5, y - height + depth * 0.5);
        topGradient.addColorStop(0, color + 'bb');
        topGradient.addColorStop(0.52, 'rgba(15, 23, 42, 0.92)');
        topGradient.addColorStop(1, color + '77');
        context.beginPath();
        context.moveTo(top[0].x, top[0].y);
        top.slice(1).forEach(point => context.lineTo(point.x, point.y));
        context.closePath();
        context.fillStyle = topGradient;
        context.fill();
        context.strokeStyle = color + 'aa';
        context.lineWidth = 1.2;
        context.stroke();

        context.shadowBlur = 0;
        context.strokeStyle = color + '44';
        context.lineWidth = 1;
        for (let index = 1; index <= 2; index += 1) {
            const lineY = bottom[1].y - index * height * 0.25;
            context.beginPath();
            context.moveTo(x + width * 0.5, lineY);
            context.lineTo(x, lineY + depth * 0.5);
            context.stroke();
        }
        context.restore();
    }

    function drawTwinFlowLane(context, from, to, time, state, options = {}) {
        const color = colorRgbForState(state);
        const curve = options.curve ?? 36;
        const width = options.width || 2;
        const reverse = Boolean(options.reverse);
        const start = reverse ? to : from;
        const end = reverse ? from : to;
        const cp1 = { x: start.x + (end.x - start.x) * 0.32, y: start.y - curve };
        const cp2 = { x: start.x + (end.x - start.x) * 0.68, y: end.y + curve * 0.5 };

        context.save();
        context.lineWidth = width + 5;
        context.strokeStyle = `rgba(${color}, 0.08)`;
        context.beginPath();
        context.moveTo(start.x, start.y - 30);
        context.bezierCurveTo(cp1.x, cp1.y - 30, cp2.x, cp2.y - 30, end.x, end.y - 30);
        context.stroke();

        context.lineWidth = width;
        context.lineCap = 'round';
        context.strokeStyle = `rgba(${color}, 0.54)`;
        if (options.dashed) {
            context.setLineDash([9, 8]);
        }
        context.beginPath();
        context.moveTo(start.x, start.y - 30);
        context.bezierCurveTo(cp1.x, cp1.y - 30, cp2.x, cp2.y - 30, end.x, end.y - 30);
        context.stroke();
        context.setLineDash([]);

        for (let index = 0; index < 3; index += 1) {
            const progress = (time * 0.28 + index * 0.34) % 1;
            const point = cubicBezierPoint(
                { x: start.x, y: start.y - 30 },
                { x: cp1.x, y: cp1.y - 30 },
                { x: cp2.x, y: cp2.y - 30 },
                { x: end.x, y: end.y - 30 },
                progress
            );
            drawTwinGlow(context, point.x, point.y, `rgb(${color})`, 22, 0.36);
            context.fillStyle = `rgba(${color}, 0.92)`;
            context.beginPath();
            context.arc(point.x, point.y, 3.2, 0, Math.PI * 2);
            context.fill();
        }
        context.restore();
    }

    function cubicBezierPoint(p0, p1, p2, p3, t) {
        const oneMinusT = 1 - t;
        return {
            x: oneMinusT ** 3 * p0.x + 3 * oneMinusT ** 2 * t * p1.x + 3 * oneMinusT * t ** 2 * p2.x + t ** 3 * p3.x,
            y: oneMinusT ** 3 * p0.y + 3 * oneMinusT ** 2 * t * p1.y + 3 * oneMinusT * t ** 2 * p2.y + t ** 3 * p3.y
        };
    }

    function colorRgbForState(state) {
        const normalized = String(state || '').toUpperCase();
        if (normalized === 'UP' || normalized === 'TRUE' || normalized === 'ONLINE') {
            return '52, 211, 153';
        }
        if (normalized === 'DEGRADED' || normalized === 'WARN') {
            return '251, 191, 36';
        }
        return '251, 113, 133';
    }

    function drawTwinGlow(context, x, y, color, radius, alpha) {
        const glowColor = toRgba(color, alpha);
        const gradient = context.createRadialGradient(x, y, 0, x, y, radius);
        gradient.addColorStop(0, glowColor);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        context.save();
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fill();
        context.restore();
    }

    function toRgba(color, alpha) {
        if (String(color).startsWith('#') && color.length === 7) {
            const red = parseInt(color.slice(1, 3), 16);
            const green = parseInt(color.slice(3, 5), 16);
            const blue = parseInt(color.slice(5, 7), 16);
            return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
        }
        if (String(color).startsWith('rgb(')) {
            return color.replace('rgb(', 'rgba(').replace(')', `, ${alpha})`);
        }
        return color;
    }

    function drawTwinTextBlock(context, label, sub, x, y, maxWidth, color) {
        context.save();
        context.textAlign = 'center';
        context.fillStyle = '#e6f4ff';
        context.font = '800 12px system-ui, sans-serif';
        drawCenteredText(context, label, x, y, maxWidth);
        context.fillStyle = color;
        context.font = '700 10px system-ui, sans-serif';
        drawCenteredText(context, sub || '--', x, y + 15, maxWidth);
        context.restore();
    }

    function drawCenteredText(context, text, x, y, maxWidth) {
        const value = String(text ?? '--');
        if (context.measureText(value).width <= maxWidth) {
            context.fillText(value, x, y);
            return;
        }
        let output = value;
        while (output.length > 1 && context.measureText(output + '...').width > maxWidth) {
            output = output.slice(0, -1);
        }
        context.fillText(output + '...', x, y);
    }

    function digitalTwinModelNodes(base) {
        const services = Array.isArray(runtimeVisualState.modelServices) && runtimeVisualState.modelServices.length
            ? runtimeVisualState.modelServices
            : [
                { name: 'Ollama 本地模型', state: 'UNKNOWN', port: 11434 },
                { name: 'Stable Diffusion', state: 'UNKNOWN', port: 7860 },
                { name: 'Wan2.1 视频桥', state: 'UNKNOWN', port: 7861 }
            ];
        const compact = base.width < 620;
        const slots = [
            { x: base.x + base.width * 0.17, y: base.y - base.depth * 0.28 },
            { x: base.x + base.width * 0.26, y: base.y - base.depth * 0.07 },
            { x: base.x + base.width * 0.12, y: base.y + base.depth * 0.12 },

                sub: compact ? `${state}${item.port ? `/${item.port}` : ''}` : `${state}${item.port ? ` · ${item.port}` : ''}`,
                state,

                canStart: Boolean(serviceId && state !== 'UP')
            };
        });

    function inferModelServiceId(name, port) {
        const text = String(name || '').toLowerCase();
        if (text.includes('ollama') || Number(port) === 11434) {
            return 'ollama';
        }
        if (text.includes('stable') || text.includes('forge') || Number(port) === 7860) {
            return 'stable-diffusion';
        }
        if (text.includes('wan') || Number(port) === 7861) {
            return 'wan-video';
        }
        return '';
    }

    function shortTwinLabel(value) {
        const text = String(value || '');
        if (text.toLowerCase().includes('ollama')) {
            return 'Ollama';
        }
        if (text.toLowerCase().includes('stable') || text.toLowerCase().includes('forge')) {
            return 'SD/Forge';
        }
        if (text.toLowerCase().includes('wan')) {
            return 'Wan2.1';
        }
        return text.length > 8 ? text.slice(0, 8) : text;

    function modelServiceNodes(width, height) {
        const services = Array.isArray(runtimeVisualState.modelServices) ? runtimeVisualState.modelServices : [];
        if (!services.length) {
            return [];
        }

        return services.slice(0, 4).map((item, index) => {
            const state = String(item.state || 'UNKNOWN').toUpperCase();
            const row = Math.floor(index / 2);
            const indexInRow = index % 2;
            const rowCount = Math.min(2, services.length - row * 2);
            const segmentWidth = Math.min(width * 0.55, Math.max(180, width * 0.6));
            const startX = Math.max(160, (width - segmentWidth) * 0.55);
            const x = startX + segmentWidth * ((indexInRow + 1) / (rowCount + 1));
            const y = height * 0.32 + row * height * 0.15;
            return {
                x,
                y,
                label: String(item.name || item.id || '模型服务'),
                sub: `${state}${item.port ? ` · ${item.port}` : ''}`,

                color: resolveModelServiceNodeColor(state),

                role: 'model'
            };
        });

    function resolveModelServiceNodeColor(state) {
        if (state === 'UP') {
            return '#34d399';
        }
        if (state === 'DEGRADED') {
            return '#fbbf24';

    function containerNodes(width, height) {

            { name: 'chart-demo', status: '未知' },

        return containers.slice(0, 3).map((item, index) => {
            const running = String(item.status || '').toLowerCase().startsWith('up');
            return {
                x: width * 0.58 + gap * (index % 3),
                y: startY + (index % 2) * height * 0.05,
                label: item.name || 'container',
                sub: item.status || '未知',
                size: 27,
                state: running ? 'UP' : 'DOWN',
                color: running ? '#34d399' : '#fb7185'
            };
        });

    function drawStarfield(context, width, height, time) {
        context.save();
        for (let i = 0; i < 56; i++) {
            const x = (Math.sin(i * 17.13) * 0.5 + 0.5) * width;
            const y = (Math.cos(i * 9.71) * 0.5 + 0.5) * height;
            const pulse = 0.35 + Math.sin(time * 1.8 + i) * 0.25;
            context.fillStyle = i % 7 === 0 ? `rgba(251, 191, 36, ${pulse})` : `rgba(34, 211, 238, ${pulse})`;
            context.beginPath();
            context.arc(x, y, i % 9 === 0 ? 2.2 : 1.2, 0, Math.PI * 2);
            context.fill();
        }
        context.restore();
    }

    function drawConnection(context, from, to, time, state, options = {}) {
        const normalizedState = String(state || '').toUpperCase();
        let color = '251, 113, 133';
        if (normalizedState === 'UP' || normalizedState === 'TRUE' || normalizedState === 'ONLINE') {
            color = '34, 211, 153';
        } else if (normalizedState === 'DEGRADED' || normalizedState === 'WARN') {
            color = '251, 191, 36';
        }
        const lineWidth = options.lineWidth || 1.4;
        const direction = options.direction || 'downstream';
        const dashed = Boolean(options.dashed);
        const stateLabel = normalizedState === 'UP' || normalizedState === 'TRUE' || normalizedState === 'ONLINE'
            ? 'UP'
            : normalizedState === 'DEGRADED' || normalizedState === 'WARN'
                ? 'DEGRADED'
                : 'DOWN';
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const angle = Math.atan2(dy, dx);
        const headLength = Math.max(8, Math.min(16, Math.hypot(dx, dy) * 0.03));
        const midX = from.x + (to.x - from.x) * 0.5;
        const midY = from.y + (to.y - from.y) * 0.5;

        context.save();
        context.strokeStyle = `rgba(${color}, 0.22)`;
        context.lineWidth = lineWidth;
        context.beginPath();
        if (dashed) {
            context.setLineDash([7, 7]);
        }
        context.moveTo(from.x, from.y);
        context.lineTo(to.x, to.y);
        context.stroke();
        context.setLineDash([]);

        const arrowAlpha = direction === 'downstream' ? 0.72 : direction === 'upstream' ? 0.5 : 0.6;
        context.strokeStyle = `rgba(${color}, ${arrowAlpha})`;
        context.fillStyle = `rgba(${color}, ${arrowAlpha})`;
        context.lineWidth = Math.max(1, lineWidth - 0.2);

        const progress = (time * 0.32 + (Number.isFinite(to.x) ? (to.x + to.y) : 0) * 0.001) % 1;
        const x = from.x + (to.x - from.x) * progress;
        const y = from.y + (to.y - from.y) * progress;
        const gradient = context.createRadialGradient(x, y, 0, x, y, 18);
        gradient.addColorStop(0, `rgba(${color}, 0.92)`);
        gradient.addColorStop(1, `rgba(${color}, 0)`);
        context.fillStyle = gradient;
        context.beginPath();
        context.arc(x, y, 18, 0, Math.PI * 2);
        context.fill();

        const arrowX = direction === 'upstream' ? from.x : to.x;
        const arrowY = direction === 'upstream' ? from.y : to.y;
        const arrowAngle = direction === 'upstream' ? angle + Math.PI : angle;
        context.save();
        context.translate(arrowX, arrowY);
        context.rotate(arrowAngle);
        context.beginPath();
        context.moveTo(0, 0);
        context.lineTo(-headLength, -headLength * 0.6);
        context.lineTo(-headLength, headLength * 0.6);
        context.closePath();
        context.fill();
        context.restore();

        if (Math.min(widthScaleForCanvas(context), 1) > 0.7 && direction !== 'both') {
            context.save();
            context.fillStyle = `rgba(${color}, 0.9)`;
            context.font = '700 10px system-ui, sans-serif';
            context.textAlign = 'center';
            context.fillText(stateLabel, midX, midY - 10);
            context.restore();
        }
        context.restore();
    }

    function widthScaleForCanvas(context) {
        const transform = context.getTransform();
        if (!transform || !transform.a) {
            return 1;
        }
        return Math.abs(transform.a);
    }

    function drawRuntimeNode(context, node, time) {
        const state = String(node.state || 'UNKNOWN').toUpperCase();
        const isCore = node.role === 'core';
        const radius = (node.size || 34) * (1 + Math.sin(time * 2.2 + node.x * 0.01) * (isCore ? 0.05 : 0.08));
        const glowScale = state === 'UP' ? 1 : state === 'DEGRADED' ? 0.92 : 0.88;
        context.save();
        context.globalAlpha = Math.min(1, 0.55 + 0.12 * glowScale);
        context.shadowColor = node.color;
        context.shadowBlur = isCore ? 34 : 24;
        context.fillStyle = 'rgba(2, 8, 18, 0.86)';
        context.strokeStyle = node.color;
        context.lineWidth = isCore ? 2.4 : 2;
        context.beginPath();
        context.arc(node.x, node.y, radius * glowScale, 0, Math.PI * 2);
        context.fill();
        context.stroke();

        if (isCore) {
            context.shadowBlur = 0;
            context.strokeStyle = `${node.color}55`;
            context.lineWidth = 1.1;
            context.beginPath();
            context.arc(node.x, node.y, radius * 1.26, -Math.PI * 0.78, Math.PI * 0.78);
            context.stroke();
        }

        context.fillStyle = node.color;
        context.beginPath();
        context.arc(node.x, node.y, isCore ? 8 : 7, 0, Math.PI * 2);
        context.fill();

        context.shadowBlur = 0;
        context.fillStyle = '#e6f4ff';
        context.font = isCore ? '800 16px system-ui, sans-serif' : '800 15px system-ui, sans-serif';
        context.textAlign = 'center';
        context.fillText(node.label, node.x, node.y + 58);
        context.fillStyle = '#9fb5c9';
        context.font = isCore ? '700 12px system-ui, sans-serif' : '12px system-ui, sans-serif';
        context.fillText(String(node.sub || '').slice(0, 22), node.x, node.y + 76);

        if (node.role === 'model' && node.state) {
            const stateColor = node.state === 'UP' ? '#34d399' : node.state === 'DEGRADED' ? '#fbbf24' : '#fb7185';
            context.fillStyle = stateColor;
            context.font = '700 11px system-ui, sans-serif';
            context.fillText(node.state, node.x, node.y + 90);
        }
        context.restore();
    }

    function drawMemoryOrbit(context, node, percent, time) {
        const radius = 58;
        const end = Math.PI * 2 * Math.min(percent, 100) / 100;
        context.save();
        context.lineWidth = 8;
        context.strokeStyle = 'rgba(125, 211, 252, 0.12)';
        context.beginPath();
        context.arc(node.x, node.y, radius, 0, Math.PI * 2);
        context.stroke();
        context.strokeStyle = percent > 80 ? '#fb7185' : '#22d3ee';
        context.beginPath();
        context.arc(node.x, node.y, radius, -Math.PI / 2 + time * 0.18, -Math.PI / 2 + time * 0.18 + end);
        context.stroke();
        context.restore();
    }

    function formatDuration(seconds) {
        const value = Number(seconds || 0);
        const days = Math.floor(value / 86400);
        const hours = Math.floor((value % 86400) / 3600);
        const minutes = Math.floor((value % 3600) / 60);
        if (days > 0) {
            return `${days}d ${hours}h`;
        }
        if (hours > 0) {
            return `${hours}h ${minutes}m`;
        }
        return `${minutes}m`;
    }

    function formatTime(value) {
        if (!value) {
            return '--';
        }
        return new Date(value).toLocaleTimeString('zh-CN', { hour12: false });
    }

    function formatPercent(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number < 0) {
            return '--';
        }
        return `${number.toFixed(1)}%`;
    }

    function formatLatency(value) {
        const number = Number(value);
        if (!Number.isFinite(number) || number < 0) {
            return '--';
        }
        return `${Math.round(number)} ms`;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    document.addEventListener('DOMContentLoaded', function () {
        const nodeLabelLayer = document.getElementById('runtime-node-label-layer');
        if (nodeLabelLayer) {
            nodeLabelLayer.addEventListener('click', handleModelServiceStartClick);
        }
        refreshRuntimeDashboard();
        startRuntimeCanvas();
        startRuntimeMetricsCanvas();
        runtimeTimer = setInterval(refreshRuntimeDashboard, 3000);
    });

    window.addEventListener('beforeunload', function () {
        if (runtimeTimer) {
            clearInterval(runtimeTimer);
        }
        if (runtimeAnimationFrame) {
            cancelAnimationFrame(runtimeAnimationFrame);
        }
        if (runtimeMetricsAnimationFrame) {
            cancelAnimationFrame(runtimeMetricsAnimationFrame);
        }
        if (runtimeStartToastTimer) {
            clearTimeout(runtimeStartToastTimer);
        }
    });
</script>
