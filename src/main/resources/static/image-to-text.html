    <!-- JavaScript -->
    <script>
        // 全局变量
        let uploadedImage = null;

        // 初始化上传区域
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('image-upload-area');
            const fileInput = document.getElementById('image-upload');

            // 点击上传
            uploadArea.addEventListener('click', function() {
                fileInput.click();
            });

            // 文件选择
            fileInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    handleFileUpload(e.target.files[0]);
                }
            });

            // 拖拽上传
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('drag-active');
            });

            uploadArea.addEventListener('dragleave', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('drag-active');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('drag-active');

                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    handleFileUpload(e.dataTransfer.files[0]);
                }
            });
        });

        // 处理文件上传
        function handleFileUpload(file) {
            // 验证文件类型
            if (!file.type.startsWith('image/')) {
                renderDescriptionFailure({
                    message: '请上传图片文件',
                    description: '当前只支持 JPG / PNG / WebP 格式图片。',
                    error: '文件类型不符合图片 MIME 要求。'
                });
                return;
            }

            // 验证文件大小
            if (file.size > 10 * 1024 * 1024) {
                renderDescriptionFailure({
                    message: '图片大小超限',
                    description: '请在 10MB 以下重新上传。支持 JPG / PNG / WebP。',
                    error: '上传文件体积过大。'
                });
                return;
            }

            uploadedImage = file;

            // 显示图片预览
            const reader = new FileReader();
            reader.onload = function(e) {
                const previewImage = document.getElementById('preview-image');
                previewImage.src = e.target.result;
                document.getElementById('image-preview').classList.remove('hidden');
                document.getElementById('generate-settings').classList.remove('hidden');
                document.getElementById('generate-section').classList.remove('hidden');
                document.getElementById('description-result').classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // 生成描述
        function generateDescription() {
            if (!uploadedImage) {
                renderDescriptionFailure({
                    message: '请先上传图片',
                    description: '请先选择一张清晰图片，系统将基于图片内容生成描述。'
                });
                return;
            }

            const descriptionType = document.getElementById('description-type').value;
            const descriptionLanguage = document.getElementById('description-language').value;
            const generateButton = document.getElementById('generate-button');
            const loading = document.getElementById('loading');
            const descriptionResult = document.getElementById('description-result');

            // 显示加载动画
            generateButton.disabled = true;
            generateButton.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 生成中...';
            loading.classList.remove('hidden');
            descriptionResult.classList.add('hidden');

            // 创建FormData对象
            const formData = new FormData();
            formData.append('image', uploadedImage);
            formData.append('type', descriptionType);
            formData.append('language', descriptionLanguage);

            // 调用后端API
            fetch('/api/image/describe', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                renderDescriptionResult(data);
            })
            .catch(error => {
                console.error('生成描述失败:', error);
                renderDescriptionFailure({
                    message: '图生文请求失败',
                    description: '当前无法连接图生文服务，请稍后重试或联系管理员检查模型接入。',
                    error: error.message
                });
            })
            .finally(() => {
                // 隐藏加载动画
                generateButton.disabled = false;
                generateButton.innerHTML = '<i class="fa fa-magic mr-2"></i> 生成描述';
                loading.classList.add('hidden');
            });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[character] || character));
        }

        function isReusablePromptSection(sectionName) {
            return /^(可复用提示词|Reusable prompt)$/i.test(String(sectionName || '').trim());
        }

        function formatDescriptionText(description) {
            const rawText = String(description || '').trim();
            if (!rawText) {
                return '<p class="description-paragraph">未返回可用描述。</p>';
            }

            const sectionPattern = '(主描述|细节补充|可复用提示词|Main description|Detail notes|Details|Reusable prompt)';
            const sectionWithContent = new RegExp(`^(?:#{1,4}\\s*)?(?:\\d+[.、]\\s*)?${sectionPattern}\\s*[：:]\\s*(.*)$`, 'i');
            const sectionOnly = new RegExp(`^(?:#{1,4}\\s*)?(?:\\d+[.、]\\s*)?${sectionPattern}\\s*$`, 'i');
            const bulletPattern = /^(?:[-*•]\s+|\d+[.、]\s+)(.+)$/;
            const lines = rawText.split(/\r?\n/);
            let currentSection = '';
            let html = '';
            let listItems = [];

            const flushList = () => {
                if (listItems.length === 0) {
                    return;
                }
                html += `<ul class="description-list">${listItems.map(item => `<li>${item}</li>`).join('')}</ul>`;
                listItems = [];
            };

            const renderParagraph = (text) => {
                const className = isReusablePromptSection(currentSection)
                    ? 'description-copy-block'
                    : 'description-paragraph';
                html += `<p class="${className}">${escapeHtml(text)}</p>`;
            };

            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) {
                    flushList();
                    return;
                }

                const sectionMatch = trimmedLine.match(sectionWithContent);
                if (sectionMatch) {
                    flushList();
                    currentSection = sectionMatch[1].trim();
                    html += `<h4 class="description-section-title">${escapeHtml(currentSection)}</h4>`;
                    const sectionContent = sectionMatch[2].trim();
                    if (sectionContent) {
                        renderParagraph(sectionContent);
                    }
                    return;
                }

                const headingMatch = trimmedLine.match(sectionOnly);
                if (headingMatch) {
                    flushList();
                    currentSection = headingMatch[1].trim();
                    html += `<h4 class="description-section-title">${escapeHtml(currentSection)}</h4>`;
                    return;
                }

                const bulletMatch = trimmedLine.match(bulletPattern);
                if (bulletMatch) {
                    listItems.push(escapeHtml(bulletMatch[1].trim()));
                    return;
                }

                flushList();
                renderParagraph(trimmedLine);
            });

            flushList();
            return html || '<p class="description-paragraph">未返回可用描述。</p>';
        }

        function normalizeModelAvailability(modelAvailability, attemptedModels = []) {
            const entries = Array.isArray(modelAvailability) ? modelAvailability : [];
            const rows = new Map();

            entries.forEach(item => {
                if (!item || typeof item !== 'object') {
                    return;
                }

                const model = String(item.model || '').trim();
                const provider = String(item.provider || '').trim();
                if (!model && !provider) {
                    return;
                }

                const available = item.available === true
                    ? true
                    : item.available === false
                        ? false
                        : null;
                const reason = typeof item.reason === 'string' ? item.reason.trim() : '';
                const key = `${provider || 'provider'}::${model || 'model'}`;
                rows.set(key, {
                    model,
                    provider,
                    available,
                    reason
                });
            });

            const hasModel = (targetModel) => {
                for (const value of rows.values()) {
                    if (value.model === targetModel) {
                        return true;
                    }
                }
                return false;
            };

            if (Array.isArray(attemptedModels)) {
                attemptedModels.forEach(model => {
                    const normalizedModel = String(model || '').trim();
                    if (!normalizedModel) {
                        return;
                    }
                    if (hasModel(normalizedModel)) {
                        return;
                    }
                    rows.set(`unknown::${normalizedModel}`, {
                        model: normalizedModel,
                        provider: 'provider',
                        available: null,
                        reason: ''
                    });
                });
            }

            return Array.from(rows.values());
        }

        function renderModelAvailabilitySection(modelAvailability, attemptedModels, title) {
            const entries = normalizeModelAvailability(modelAvailability, attemptedModels)
                .sort((first, second) => {
                    const rank = (item) => {
                        if (item.available === false) {
                            return 0;
                        }
                        if (item.available === null) {
                            return 1;
                        }
                        return 2;
                    };
                    const compare = rank(first) - rank(second);
                    if (compare !== 0) {
                        return compare;
                    }
                    return (first.model || '').localeCompare(second.model || '');
                });
            if (entries.length === 0) {
                return '';
            }

            const listHtml = entries.map(entry => {
                const statusText = entry.available === true
                    ? '可用'
                    : entry.available === false
                        ? '不可用'
                        : '未判定';

                const statusClass = entry.available === true
                    ? 'text-green-700 bg-green-50 border-green-200'
                    : entry.available === false
                        ? 'text-amber-700 bg-amber-50 border-amber-200'
                        : 'text-gray-700 bg-gray-100 border-gray-200';

                const reasonText = entry.reason
                    ? `<p class="text-xs mt-1 text-gray-600">原因：${escapeHtml(entry.reason)}</p>`
                    : '';

                const modelText = `${entry.model || '未知模型'}${entry.provider ? `（${entry.provider}）` : ''}`;

                return `
                    <li class="rounded-lg border px-3 py-2 ${statusClass}">
                        <div class="text-sm font-medium">${escapeHtml(modelText)}</div>
                        <div class="text-xs">状态：${statusText}</div>
                        ${reasonText}
                    </li>
                `;
            }).join('');

            return `
                <div class="rounded-lg border border-gray-200 bg-white/70 p-3 mt-3">
                    <div class="text-sm font-semibold text-dark">${escapeHtml(title || '模型可用性')}</div>
                    <ul class="mt-2 space-y-2 text-xs">${listHtml}</ul>
                </div>
            `;
        }

        function renderDescriptionResult(data) {
            const descriptionResult = document.getElementById('description-result');
            const descriptionContent = document.getElementById('description-content');
            const copyButton = document.getElementById('copy-description-button');

            if (data.success && data.fallback !== true) {
                descriptionContent.className = 'description-content--quality';
                descriptionContent.dataset.copyText = data.description || '';
                descriptionContent.innerHTML = formatDescriptionText(data.description || '');
                copyButton.classList.remove('hidden');
                descriptionResult.classList.remove('hidden');
                scrollDescriptionResultIntoView();
                return;
            }

            const hasLocalFallback = data.fallback === true;
            const message = hasLocalFallback
                ? (data.message || '图片理解模型不可用')
                : (data.description || data.message || '图片描述生成失败');
            const fallbackSummary = hasLocalFallback && data.description
                ? `
                    <div class="rounded-lg border border-amber-300 bg-white/70 p-3 mt-3">
                        <div class="text-sm font-semibold text-dark">本地基础摘要</div>
                        <p class="text-sm text-gray-700 mt-2">${escapeHtml(data.description)}</p>
                    </div>
                `
                : '';
            const triedModels = Array.isArray(data.visionModelsTried) && data.visionModelsTried.length > 0
                ? `<p class="text-xs text-gray-500 mt-2">已检查图片理解模型：${escapeHtml(data.visionModelsTried.join('、'))}</p>`
                : '';
            const modelAvailabilitySummary = renderModelAvailabilitySection(
                data.modelAvailability,
                data.visionModelsTried,
                '图片理解模型可用性'
            );
            const isModelUnavailable = data.modelUnavailable === true;
            const modelUnavailableHint = isModelUnavailable
                ? '<p class="text-sm text-gray-700 mt-2">当前选用图片理解模型未返回可用结果，请先确认服务、API Key 与模型配置。</p>'
                : '';
            const suggestion = data.actionSuggestion || '请确认图像理解模型可用后再重试。';
            const detail = [message, data.description, data.error].filter(Boolean).join('\n\n') || '当前没有返回可用描述。';

            descriptionContent.className = 'text-gray-700 whitespace-pre-wrap';
            delete descriptionContent.dataset.copyText;
            descriptionContent.innerHTML = `
                <div class="border border-warning/50 bg-warning/10 p-5">
                    <div class="flex items-start gap-3">
                        <i class="fa fa-triangle-exclamation text-warning text-xl mt-1"></i>
                        <div class="w-full">
                            <h4 class="font-semibold text-dark">当前图生文通道未就绪</h4>
                            <p class="text-sm text-gray-700 mt-2">系统已完成请求收集，但当前演示环境没有可用的图片理解链路返回可靠结果。</p>
                            ${modelUnavailableHint}
                            ${fallbackSummary}
                            <div class="rounded-lg border border-warning/30 bg-white/60 p-3 mt-3">
                                <div class="text-sm font-semibold text-dark">处理建议</div>
                                <p class="text-sm text-gray-700 mt-2">${escapeHtml(suggestion)}</p>
                            </div>
                            ${triedModels}
                            ${modelAvailabilitySummary}
                            <button type="button" onclick="toggleDescriptionFailureDetail()" class="mt-3 text-sm text-primary hover:underline">
                                查看技术详情
                            </button>
                            <pre id="description-error-detail" class="hidden mt-3 whitespace-pre-wrap rounded-lg bg-gray-900 text-gray-100 p-3 text-xs">${escapeHtml(detail)}</pre>
                        </div>
                    </div>
                </div>
            `;
            copyButton.classList.add('hidden');
            descriptionResult.classList.remove('hidden');
            scrollDescriptionResultIntoView();
        }

        function scrollDescriptionResultIntoView() {
            const analysisViewport = document.querySelector('.media-preview-panel');
            const descriptionResult = document.getElementById('description-result');
            if (!analysisViewport || !descriptionResult) {
                return;
            }
            window.requestAnimationFrame(() => {
                analysisViewport.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
                descriptionResult.focus({ preventScroll: true });
            });
        }

        // 复制描述
        function copyDescription() {
            const descriptionContent = document.getElementById('description-content');
            const description = descriptionContent.dataset.copyText || descriptionContent.textContent;
            navigator.clipboard.writeText(description)
                .then(() => {
                    alert('描述已复制到剪贴板');
                })
                .catch(err => {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
            });
        }

        function renderDescriptionFailure(data) {
            renderDescriptionResult({
                success: false,
                description: data.description || '图片描述生成失败',
                message: data.message,
                error: data.error,
                actionSuggestion: data.actionSuggestion,
                modelAvailability: data.modelAvailability,
                visionModelsTried: data.visionModelsTried
            });
        }

        function toggleDescriptionFailureDetail() {
            const detail = document.getElementById('description-error-detail');
            if (detail) {
                detail.classList.toggle('hidden');
            }
        }

        // 重新生成描述
        function regenerateDescription() {
            generateDescription();
        }
    </script>
