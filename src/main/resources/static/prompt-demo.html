    <script>
        let currentTemplate = null;
        let templates = {};

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
            gfm: true
        });

        async function loadTemplates() {
            try {
                const response = await fetch('/prompt/templates');
                const data = await response.json();
                templates = data.templates;
                renderTemplateList();
            } catch (error) {
                console.error('加载模板失败:', error);
                document.getElementById('templateList').innerHTML = `
                    <div class="empty-state">
                        <p>加载模板失败，请刷新页面重试</p>
                    </div>
                `;
            }
        }

        function renderTemplateList(filter = 'all') {
            const listContainer = document.getElementById('templateList');
            listContainer.innerHTML = '';

            let filteredTemplates = Object.values(templates);
            if (filter !== 'all') {
                filteredTemplates = filteredTemplates.filter(t => t.category === filter);
            }

            if (filteredTemplates.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <p>该分类下暂无模板</p>
                    </div>
                `;
                return;
            }

            filteredTemplates.forEach(template => {
                const item = document.createElement('div');
                item.className = 'template-item';
                const categoryLabel = getCategoryLabel(template.category);
                item.innerHTML = `
                    <h3>${template.name}</h3>
                    <p>${template.description}</p>
                    <span class="template-category ${template.category}">${categoryLabel}</span>
                `;
                item.onclick = () => selectTemplate(template.id);
                listContainer.appendChild(item);
            });
        }

        function getCategoryLabel(category) {
            const labels = {
                'eq': '💝 高情商',
                'work': '💼 工作',
                'creative': '✨ 创意'
            };
            return labels[category] || '📋 其他';
        }

        function filterTemplates(category) {
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            renderTemplateList(category);
        }

        function selectTemplate(templateId) {
            currentTemplate = templates[templateId];

            document.querySelectorAll('.template-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            document.getElementById('templateName').value = currentTemplate.name;
            document.getElementById('promptTemplate').value = currentTemplate.template;

            renderVariables(currentTemplate.variables);
        }

        function renderVariables(variables) {
            const grid = document.getElementById('variablesGrid');
            grid.innerHTML = '';

            if (!variables || Object.keys(variables).length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1; padding: 20px;">
                        <p>当前模板没有变量</p>
                    </div>
                `;
                return;
            }

            Object.entries(variables).forEach(([key, label]) => {
                const item = document.createElement('div');
                item.className = 'variable-item';
                item.innerHTML = `
                    <label>${label}</label>
                    <textarea id="var_${key}" placeholder="请输入${label}..."></textarea>
                `;
                grid.appendChild(item);
            });
        }

        function getVariables() {
            const variables = {};
            document.querySelectorAll('.variable-item textarea').forEach(textarea => {
                const key = textarea.id.replace('var_', '');
                variables[key] = textarea.value;
            });
            return variables;
        }

        async function testPrompt() {
            const template = document.getElementById('promptTemplate').value;
            const variables = getVariables();

            if (!template.trim()) {
                alert('请输入提示词模板');
                return;
            }

            const testButton = document.getElementById('testButton');
            const resultContent = document.getElementById('resultContent');

            testButton.disabled = true;
            testButton.innerHTML = '<span class="loading"></span> 测试中...';
            resultContent.innerHTML = `
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <p>AI 正在思考中...</p>
                </div>
            `;

            try {
                const response = await fetch('/prompt/test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        template: template,
                        variables: variables
                    })
                });

                const result = await response.text();
                resultContent.innerHTML = formatResponse(result);

                document.querySelectorAll('.result-content pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } catch (error) {
                resultContent.innerHTML = `
                    <div class="empty-state" style="color: #e74c3c;">
                        <p>❌ 错误: ${error.message}</p>
                    </div>
                `;
            }

            testButton.disabled = false;
            testButton.innerHTML = '测试提示词';
        }

        function formatResponse(text) {
            try {
                const jsonMatch = text.match(/```json\n([\s\S]*?)\n```/);
                if (jsonMatch) {
                    const jsonStr = jsonMatch[1];
                    try {
                        const jsonObj = JSON.parse(jsonStr);
                        const formattedJson = JSON.stringify(jsonObj, null, 2);
                        text = text.replace(jsonMatch[0], `\`\`\`json\n${formattedJson}\n\`\`\``);
                    } catch (e) {
                        console.log('JSON parse error:', e);
                    }
                }
                return marked.parse(text);
            } catch (e) {
                console.error('Markdown parse error:', e);
                return text.replace(/\n/g, '<br>');
            }
        }

        function clearTemplate() {
            document.getElementById('templateName').value = '';
            document.getElementById('promptTemplate').value = '';
            document.getElementById('variablesGrid').innerHTML = `
                <div class="empty-state" style="grid-column: 1 / -1; padding: 20px;">
                    <p>选择模板或添加变量后显示</p>
                </div>
            `;
            currentTemplate = null;
            document.querySelectorAll('.template-item').forEach(item => {
                item.classList.remove('active');
            });
        }

        loadTemplates();
    </script>
